<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lantica 1960 | Ethiopian Restaurant & Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #E8E0D5;
        }
        :root {
            --gold: #C9A96E;
            --gold-dark: #B8933F;
            --red: #B45F3B;
            --dark-card: #1A1A1A;
            --gray: #9B8A74;
        }
        
        .topbar {
            background: #000;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(201,169,110,0.2);
        }
        .topbar i { color: var(--gold); }
        .topbar span { color: var(--gold); font-weight: 700; }
        
        .header {
            background: rgba(13,13,13,0.96);
            backdrop-filter: blur(18px);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            text-align: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
        }
        .logo span { color: var(--gold); }
        .tagline {
            font-size: 0.7rem;
            color: var(--gray);
            letter-spacing: 2px;
        }
        
        .hero {
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 100%),
                url('https://raw.githubusercontent.com/developereth/Lantica/main/logo.jpg') center/cover no-repeat;
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: white;
        }
        .hero h1 span { color: var(--gold); }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .category {
            margin-bottom: 50px;
        }
        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 25px;
            border-left: 4px solid var(--gold);
            padding-left: 15px;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .menu-card {
            background: var(--dark-card);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #2C2823;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(201,169,110,0.15);
        }
        
        .menu-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .menu-info {
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .menu-price {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .footer {
            text-align: center;
            padding: 40px 20px;
            background: #020202;
            margin-top: 40px;
        }
        .footer p {
            color: var(--gray);
            font-size: 0.8rem;
        }
        
        @media (max-width: 700px) {
            .menu-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2rem; }
            .category-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <i class="fas fa-clock"></i> Open Daily: <span>9am – 11pm</span> &nbsp;|&nbsp;
    <i class="fas fa-map-marker-alt"></i> Bole, Addis Ababa &nbsp;|&nbsp;
    <i class="fas fa-phone"></i> <span>+251 98 1960 1960</span>
</div>

<header class="header">
    <div class="logo">LANTICA <span>1960</span></div>
    <div class="tagline">ETHIOPIAN SOUL · MODERN ELEGANCE</div>
</header>

<section class="hero">
    <h1>LANTICA <span>1960</span></h1>
    <p style="color: #D1C5B5; margin-top: 10px;">Cafe & Restaurant — Since 1996</p>
</section>

<div class="container" id="menuContainer"></div>

<footer class="footer">
    <p>📍 Bole, Addis Ababa | 📞 +251 98 1960 1960</p>
    <p style="margin-top: 10px;">Lantica 1960 — Where tradition meets flavor</p>
</footer>

<script>
    // ========== MENU DATA WITH YOUR IMAGE URLS (FIXED) ==========
    const baseImageUrl = "https://raw.githubusercontent.com/developereth/Lantica/main/";
    
    const menuData = {
        "☀️ Breakfast": [
            { name: "Combo Fasting Platter", price: 250, img: "combo-fasting-platter.jpg" },
            { name: "Egg with Minced Meat", price: 250, img: "egg-with-minced-meat.jpg" },
            { name: "Special Fetera", price: 350, img: "special-fetera-honey-cheese.jpg" },
            { name: "Classic Fetera", price: 200, img: "classic-fetera.webp" },
            { name: "Egg Sandwich", price: 200, img: "egg-sandwich.jpg" },
            { name: "Cheese Omelette", price: 220, img: "chese-omelette.jpg" }
        ],
        "🍢 Appetizers": [
            { name: "Kiba Firfir", price: 210, img: "kiba-firfir.webp" },
            { name: "Shiro Bekibe", price: 300, img: "shiro-bekibe.jpeg" },
            { name: "Dulet", price: 330, img: "dulet-minced-tripe.jpeg" },
            { name: "Tomato Lebleb", price: 180, img: "tomato-lebleb.jpg" },
            { name: "Mesere", price: 250, img: "mesere-red-lentil.jpeg" },
            { name: "Mixed Garden Salad", price: 200, img: "mixed-garden-salad-2.jpg" }
        ],
        "🔥 Signatures": [
            { name: "Lamb Tibs", price: 680, img: "lamb-tibs.jpg" },
            { name: "Lamb Tibs Tefresho", price: 700, img: "lamb-tibs-tefersho.jpg" },
            { name: "Quanta Firfir", price: 370, img: "kuanta-firfir.jpeg" },
            { name: "Mahberawi Mixed Platter", price: 1200, img: "mahberawi-mixed-platter.jpeg" },
            { name: "Gomen Kitto", price: 300, img: "gomen-kitfo.jpg" },
            { name: "Tegabino", price: 300, img: "tegabino.jpg" }
        ],
        "🍕 Pizza": [
            { name: "Special Lentic Pizza", price: 580, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" },
            { name: "Tuna Pizza", price: 550, img: "tuna-pizza.jpeg" },
            { name: "Meat Pizza", price: 450, img: "meat-pizza.jpg" },
            { name: "Chicken Pizza", price: 550, img: "chicken-pizza.jpeg" },
            { name: "Margarita Pizza", price: 450, img: "margherita-pizza.jpg" },
            { name: "Vegetable Pizza", price: 400, img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400" }
        ],
        "🍝 Pasta": [
            { name: "Spaghetti with Vegetables", price: 230, img: "pasta-with-veggies-25.jpg" },
            { name: "Spaghetti with Meat Sauce", price: 350, img: "Spaghetti-with-meat-sauce.jpg" }
        ],
        "🥤 Juices": [
            { name: "Papaya Juice", price: 160, img: "papaya-juice.jpg" },
            { name: "Avocado Juice", price: 160, img: "avocado-juice.png" },
            { name: "Mango Juice", price: 160, img: "mango-juice.jpeg" },
            { name: "Tella Juice", price: 200, img: "tella-juice.webp" },
            { name: "Mixed Fruit Juice", price: 180, img: "mixed-fruit-juice-500x500.jpg" }
        ],
        "🧊 Cold Drinks": [
            { name: "Mineral Water", price: 55, img: "ambo-water.jpeg" },
            { name: "Soft Drink", price: 60, img: "soft-drink.jpeg" },
            { name: "Ambo Water", price: 65, img: "ambo-water.jpeg" },
            { name: "Ice Tea", price: 80, img: "ice-tea-1200x1800-1.jpeg" }
        ],
        "☕ Hot Beverages": [
            { name: "Ethiopian Coffee", price: 60, img: "ethiopian-coffee-Buna.jpeg" },
            { name: "Tea", price: 30, img: "https://images.unsplash.com/photo-1597481499750-3e6b07537ed8?w=400" },
            { name: "Latte", price: 70, img: "Latte.jpg" },
            { name: "Macchiato", price: 75, img: "mackiyato.jpg" },
            { name: "Spiced Tea", price: 45, img: "spiced-tea-kesher.webp" },
            { name: "Hot Chocolate", price: 80, img: "hot-chocolate.jpg" },
            { name: "House Special Coffee", price: 150, img: "house-special-coffee.jpg" }
        ]
    };
    
    function renderMenu() {
        const container = document.getElementById("menuContainer");
        let html = '';
        
        for (const [category, items] of Object.entries(menuData)) {
            html += `<div class="category">
                <div class="category-title">${category}</div>
                <div class="menu-grid">`;
            
            items.forEach(item => {
                let imgUrl = item.img;
                // If it's a relative path (starts with http? no), add base URL
                if (!imgUrl.startsWith('http')) {
                    imgUrl = baseImageUrl + imgUrl;
                }
                
                html += `
                    <div class="menu-card">
                        <img class="menu-img" src="${imgUrl}" alt="${item.name}" 
                             onerror="this.src='https://placehold.co/400x200/1A1A1A/C9A96E?text=${encodeURIComponent(item.name)}'">
                        <div class="menu-info">
                            <span class="menu-name">${escapeHtml(item.name)}</span>
                            <span class="menu-price">${item.price} ETB</span>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
        }
        
        container.innerHTML = html;
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    renderMenu();
</script>
</body>
</html>
