<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lantica 1960 | Complete Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #E8E0D5; }
        :root { --gold: #C9A96E; --dark-card: #1A1A1A; --gray: #9B8A74; --gray-light: #D1C5B5; }
        
        .navbar { background: rgba(13,13,13,0.95); backdrop-filter: blur(20px); border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-circle { width: 45px; height: 45px; border-radius: 50%; overflow: hidden; border: 2px solid var(--gold); }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 800; color: white; }
        .logo-text span { color: var(--gold); }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: var(--gray-light); text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: var(--gold); }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.8rem; color: var(--gold); cursor: pointer; }
        
        .mobile-nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1100; opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .mobile-nav-overlay.active { opacity: 1; visibility: visible; }
        .mobile-nav { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0D0D0D; border-right: 2px solid var(--gold); z-index: 1101; transition: left 0.3s ease; padding: 80px 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        .mobile-nav.open { left: 0; }
        .mobile-nav a { color: var(--gray-light); text-decoration: none; font-size: 1rem; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .mobile-nav a i { width: 25px; color: var(--gold); }
        .mobile-nav a:hover { background: rgba(201,169,110,0.1); color: var(--gold); }
        .mobile-nav-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: var(--gold); cursor: pointer; background: none; border: none; }
        
        .menu-header { background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%), url('https://res.cloudinary.com/dwqgdpcnr/image/upload/v1/lantica1960/backgrounds/hero') center/cover no-repeat; text-align: center; padding: 80px 20px; }
        .menu-header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 900; color: white; }
        .menu-header h1 span { color: var(--gold); }
        
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
        .search-bar { margin-bottom: 30px; display: flex; justify-content: center; }
        .search-input { padding: 14px 20px; width: 100%; max-width: 400px; background: var(--dark-card); border: 1px solid #2C2823; border-radius: 50px; color: white; }
        .category-filter { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .filter-btn { background: var(--dark-card); border: 1px solid #2C2823; padding: 8px 20px; border-radius: 40px; color: var(--gray-light); cursor: pointer; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: var(--gold); color: #0A0A0A; }
        .menu-category { margin-bottom: 50px; }
        .category-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 20px; border-left: 4px solid var(--gold); padding-left: 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .menu-item { background: var(--dark-card); padding: 18px 22px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2C2823; transition: 0.3s; }
        .menu-item:hover { border-color: var(--gold); transform: translateX(5px); }
        .item-name { font-weight: 500; }
        .item-price { color: var(--gold); font-weight: 700; }
        .stats { text-align: center; padding: 20px; background: var(--dark-card); border-radius: 20px; margin-top: 30px; }
        
        .floating-telegram { position: fixed; bottom: 30px; left: 30px; background: #0088cc; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; text-decoration: none; z-index: 999; border: 2px solid white; transition: 0.3s; }
        .floating-telegram:hover { transform: scale(1.1); background: #0077b3; }
        .footer { background: #020202; text-align: center; padding: 30px; margin-top: 40px; }
        .footer a { color: var(--gold); text-decoration: none; }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: flex; }
            .menu-header h1 { font-size: 2rem; }
            .menu-grid { grid-template-columns: 1fr; }
            .floating-telegram { width: 50px; height: 50px; font-size: 1.5rem; bottom: 20px; left: 20px; }
        }
    </style>
</head>
<body>

<a href="https://t.me/+251941270797" target="_blank" class="floating-telegram"><i class="fab fa-telegram-plane"></i></a>

<div class="mobile-nav-overlay" id="mobileOverlay" onclick="closeMobileMenu()"></div>
<div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" onclick="closeMobileMenu()">✕</button>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="menu.html"><i class="fas fa-utensils"></i> Menu</a>
    <a href="gallery.html"><i class="fas fa-images"></i> Food Gallery</a>
    <a href="heritage.html"><i class="fas fa-landmark"></i> Heritage Gallery</a>
    <a href="index.html#about"><i class="fas fa-info-circle"></i> About</a>
    <a href="index.html#events"><i class="fas fa-calendar-alt"></i> Events</a>
    <a href="index.html#contact"><i class="fas fa-phone-alt"></i> Contact</a>
</div>

<nav class="navbar">
    <a href="index.html" class="logo">
        <div class="logo-circle"><img src="https://res.cloudinary.com/dwqgdpcnr/image/upload/v1/lantica1960/logo/logo.jpg" alt="Lantica 1960 Logo"></div>
        <div class="logo-text">LANTICA <span>1960</span></div>
    </a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" style="color: var(--gold);">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="heritage.html">Heritage</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#events">Events</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <button class="mobile-menu-btn" onclick="openMobileMenu()"><i class="fas fa-bars"></i></button>
</nav>

<section class="menu-header">
    <h1>Our <span>Complete Menu</span></h1>
    <p style="color: var(--gray-light); margin-top: 10px;">📍 Arat Kilo, Addis Ababa | Since 1996</p>
</section>

<div class="container">
    <div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="🔍 Search menu items..."></div>
    <div class="category-filter" id="categoryFilters"></div>
    <div id="menuContainer"></div>
    <div class="stats" id="stats"></div>
</div>

<footer class="footer">
    <p>📍 Arat Kilo, Addis Ababa | 📞 +251 94 1270 797</p>
    <p>Powered by <a href="https://addispower.pages.dev/" target="_blank">AddisPower</a></p>
</footer>

<script>
    const menuData = {
        "☀️ Breakfast": ["Combo Fasting - 250", "Egg w/ meat - 250", "Special Fetora - 350", "Normal Fetora - 200", "Egg Sandwich - 200"],
        "🔥 Traditional Food": ["Lamb Tibs - 680", "Lamb Tibs Tefresho - 700", "Chikena Tibs - 600", "Mahberawi - 1200", "Yefisk Agelgel - 1000", "Gomen Kitto - 300"],
        "🍕 Pizza": ["Special Lentic Pizza Large - 580", "Chicken Pizza Large - 550", "Margarita Large - 450"],
        "🍔 Burgers": ["Noma Burger - 305", "Cheese Burger - 350", "Chicken Shawarma - 600", "French Fries - 180"],
        "🥤 Juices": ["Papaya Juice - 160", "Avocado Juice - 160", "Mango Juice - 160"],
        "☕ Hot Beverages": ["Tea - 30", "Coffee - 60", "Latte - 70", "Macchiato - 75", "Hot Chocolate - 80"]
    };

    let currentFilter = "all";
    let currentSearch = "";
    function getCategories() { return Object.keys(menuData); }
    function renderFilters() {
        let html = `<button class="filter-btn ${currentFilter === "all" ? "active" : ""}" onclick="setFilter('all')">All</button>`;
        getCategories().forEach(cat => { html += `<button class="filter-btn ${currentFilter === cat ? "active" : ""}" onclick="setFilter('${cat}')">${cat}</button>`; });
        document.getElementById("categoryFilters").innerHTML = html;
    }
    function setFilter(category) { currentFilter = category; renderFilters(); renderMenu(); }
    function setSearch() { currentSearch = document.getElementById("searchInput").value.toLowerCase(); renderMenu(); }
    function renderMenu() {
        let totalItems = 0, html = "";
        for (const [category, items] of Object.entries(menuData)) {
            if (currentFilter !== "all" && currentFilter !== category) continue;
            let filteredItems = currentSearch ? items.filter(i => i.toLowerCase().includes(currentSearch)) : items;
            if (filteredItems.length === 0) continue;
            html += `<div class="menu-category"><div class="category-title">${category}</div><div class="menu-grid">`;
            filteredItems.forEach(item => { totalItems++; let p = item.split(" - "); html += `<div class="menu-item"><span class="item-name">${p[0]}</span><span class="item-price">${p[1]} ETB</span></div>`; });
            html += `</div></div>`;
        }
        document.getElementById("menuContainer").innerHTML = html || '<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:3rem;color:var(--gold);"></i><h3>No items found</h3></div>';
        document.getElementById("stats").innerHTML = `<i class="fas fa-list"></i> Showing ${totalItems} menu items | 📞 Order: +251 94 1270 797`;
    }

    function openMobileMenu() { document.getElementById("mobileNav").classList.add("open"); document.getElementById("mobileOverlay").classList.add("active"); document.body.style.overflow = "hidden"; }
    function closeMobileMenu() { document.getElementById("mobileNav").classList.remove("open"); document.getElementById("mobileOverlay").classList.remove("active"); document.body.style.overflow = "auto"; }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileMenu(); });
    document.getElementById("searchInput").addEventListener("keyup", setSearch);
    renderFilters(); renderMenu();
</script>
</body>
</html>
