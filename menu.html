<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantica 1960 | Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0A0A0A; color: #E8E0D5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #C9A96E; font-size: 2.5rem; margin-bottom: 10px; }
        .sub { text-align: center; color: #9B8A74; margin-bottom: 40px; }
        .category { margin-bottom: 40px; }
        .category-title { font-size: 1.3rem; color: #C9A96E; border-left: 3px solid #C9A96E; padding-left: 15px; margin-bottom: 20px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .item-card { background: #1A1A1A; border-radius: 16px; overflow: hidden; border: 1px solid #2C2823; }
        .item-card:hover { border-color: #C9A96E; }
        .item-img { width: 100%; height: 160px; object-fit: cover; background: #0D0D0D; }
        .item-info { padding: 15px; display: flex; justify-content: space-between; }
        .item-price { color: #C9A96E; font-weight: 700; }
        .footer { text-align: center; margin-top: 40px; padding: 20px; color: #9B8A74; }
        @media (max-width: 600px) { .menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>LANTICA <span style="color:#C9A96E;">1960</span></h1>
    <p class="sub">📍 Arat Kilo, Addis Ababa | Since 1996</p>
    <div id="menu">Loading...</div>
    <div class="footer">📞 +251 94 1270 797</div>
</div>
<script>
    const WORKER_URL = "https://lanticaadminpage.developeraddis.workers.dev";
    
    async function load() {
        try {
            const res = await fetch(`${WORKER_URL}/api/menu`);
            const data = await res.json();
            const items = data.items || [];
            const grouped = {};
            items.forEach(i => { if (!grouped[i.category]) grouped[i.category] = []; grouped[i.category].push(i); });
            let html = '';
            for (const [cat, catItems] of Object.entries(grouped)) {
                html += `<div class="category"><div class="category-title">${cat}</div><div class="menu-grid">`;
                catItems.forEach(i => {
                    const img = i.image || 'https://placehold.co/400x160/1A1A1A/C9A96E?text=' + encodeURIComponent(i.name);
                    html += `<div class="item-card"><img class="item-img" src="${img}" onerror="this.src='https://placehold.co/400x160/1A1A1A/C9A96E'"><div class="item-info"><span>${escape(i.name)}</span><span class="item-price">${i.price} ETB</span></div></div>`;
                });
                html += `</div></div>`;
            }
            document.getElementById('menu').innerHTML = html;
        } catch(e) { document.getElementById('menu').innerHTML = '<p>Loading...</p>'; }
    }
    function escape(s) { return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    load();
</script>
</body>
</html>
