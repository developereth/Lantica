        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

            border-radius: 20px;
            overflow: hidden;

            border-color: var(--gold);

        .menu-card-image {

            height: 160px;
            object-fit: cover;
            background: #0D0D0D;

        .menu-card-content {
            padding: 18px;

            justify-content: space-between;

    let currentFilter = "all";
    let currentSearch = "";

    function getCategories() { return Object.keys(menuData); }

    function renderFilters() {
        const categories = getCategories();
        let html = `<button class="filter-btn ${currentFilter === "all" ? "active" : ""}" onclick="setFilter('all')">All</button>`;
        categories.forEach(cat => {
            html += `<button class="filter-btn ${currentFilter === cat ? "active" : ""}" onclick="setFilter('${cat}')">${cat}</button>`;
        });
        document.getElementById("categoryFilters").innerHTML = html;
    }

    function setFilter(category) {
        currentFilter = category;
        renderFilters();
        renderMenu();
    }

    function setSearch() {
        currentSearch = document.getElementById("searchInput").value.toLowerCase();
        renderMenu();
    }

    function getImageUrl(imageName) {
        if (!imageName || imageName === "") {
            return PLACEHOLDER_IMAGE;
        }
        if (imageName.startsWith('http')) {
            return imageName;
        }
        return GITHUB_RAW_BASE + imageName;
    }

    function renderMenu() {
        const container = document.getElementById("menuContainer");
        const categories = getCategories();
        let totalItems = 0;
        let html = "";

        for (const category of categories) {
            if (currentFilter !== "all" && currentFilter !== category) continue;
            const items = menuData[category];
            let filteredItems = currentSearch ? items.filter(item => item.name.toLowerCase().includes(currentSearch)) : items;
            if (filteredItems.length === 0) continue;

            html += `<div class="menu-category"><div class="category-title">${category}</div><div class="menu-grid">`;
            
            filteredItems.forEach(item => {
                totalItems++;
                const imgUrl = getImageUrl(item.image);
                html += `
                    <div class="menu-card">
                        <img class="menu-card-image" src="${imgUrl}" alt="${item.name}" 
                             onerror="this.src='${PLACEHOLDER_IMAGE}'">
                        <div class="menu-card-content">
                            <span class="menu-card-name">${escapeHtml(item.name)}</span>
                            <span class="menu-card-price">${item.price} ETB</span>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
        }

        if (html === "") html = `<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:3rem;color:var(--gold);"></i><h3>No items found</h3></div>`;
        container.innerHTML = html;
        document.getElementById("stats").innerHTML = `<i class="fas fa-list"></i> Showing ${totalItems} menu items | 📞 Order: +251 94 1270 797`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById("searchInput").addEventListener("keyup", setSearch);
    renderFilters();
    renderMenu();
</script>
