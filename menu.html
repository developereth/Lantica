<head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E8E0D5;overflow-x:hidden}
        :root{--gold:#C9A96E;--gold-dark:#B8933F;--red:#B45F3B;--dark-card:#1A1A1A;--gray:#9B8A74;--gray-light:#D1C5B5;--border:#2C2823}

        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:#0A0A0A}
        ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}

        .navbar{background:rgba(10,10,10,0.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid rgba(201,169,110,0.3);position:sticky;top:0;z-index:1000;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;transition:transform 0.3s}
        .logo:hover{transform:scale(1.02)}
        .logo-circle{width:45px;height:45px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 15px rgba(201,169,110,0.2)}
        .logo-circle img{width:100%;height:100%;object-fit:cover}
        .logo-text{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:800;color:white;letter-spacing:1px}
        .logo-text span{color:var(--gold)}
        .nav-links{display:flex;gap:22px;list-style:none;align-items:center}
        .nav-links a{color:var(--gray-light);text-decoration:none;font-weight:500;font-size:0.9rem;transition:0.3s;position:relative;padding:5px 0}
        .nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:var(--gold);transition:width 0.3s}
        .nav-links a:hover,.nav-links a.active{color:var(--gold)}
        .nav-links a:hover::after,.nav-links a.active::after{width:100%}

        .menu-hero{background:linear-gradient(135deg,#0A0A0A 0%,#1a1612 50%,#0A0A0A 100%);text-align:center;padding:70px 20px 50px;border-bottom:1px solid rgba(201,169,110,0.2);position:relative;overflow:hidden}
        .menu-hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at center,rgba(201,169,110,0.03) 0%,transparent 70%);animation:heroPulse 8s ease-in-out infinite}
        @keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        .menu-hero-content{position:relative;z-index:1}
        .menu-hero .icon{font-size:3rem;color:var(--gold);margin-bottom:10px;display:inline-block;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .menu-hero h1{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:900;color:white}
        .menu-hero h1 span{color:var(--gold)}
        .menu-hero .location{display:inline-flex;align-items:center;gap:8px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);padding:10px 25px;border-radius:50px;margin-top:15px;font-size:0.9rem;color:var(--gold-light)}
        .menu-hero .location i{color:var(--gold)}

        .container{max-width:1300px;margin:0 auto;padding:35px 20px}
        .search-bar{display:flex;justify-content:center;margin-bottom:25px}
        .search-input-wrapper{position:relative;width:400px;max-width:100%}
        .search-input{padding:14px 20px 14px 45px;width:100%;background:var(--dark-card);border:2px solid var(--border);border-radius:50px;color:white;font-size:0.95rem;font-family:'Inter',sans-serif;transition:0.3s}
        .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 20px rgba(201,169,110,0.1)}
        .search-input-wrapper i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--gray);transition:0.3s}
        .search-input:focus~i,.search-input-wrapper:focus-within i{color:var(--gold)}

        .category-filter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:35px}
        .filter-btn{background:var(--dark-card);border:1px solid var(--border);padding:9px 20px;border-radius:40px;color:var(--gray-light);cursor:pointer;transition:all 0.3s;font-weight:500;font-size:0.85rem;white-space:nowrap}
        .filter-btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
        .filter-btn.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:600;box-shadow:0 5px 20px rgba(201,169,110,0.3)}

        .menu-category{margin-bottom:45px;animation:fadeInUp 0.4s ease-out}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .category-title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold);margin-bottom:25px;padding-left:18px;border-left:4px solid var(--gold);display:flex;align-items:center;gap:12px}
        .category-count{font-size:0.85rem;color:var(--gray);font-family:'Inter',sans-serif;font-weight:400}

        .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
        .menu-card{background:var(--dark-card);border-radius:18px;overflow:hidden;border:1px solid var(--border);transition:all 0.3s cubic-bezier(0.4,0,0.2,1);cursor:pointer}
        .menu-card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 15px 35px rgba(201,169,110,0.12);background:#1f1f1f}
        .menu-card-image-wrapper{position:relative;overflow:hidden}
        .menu-card-image{width:100%;height:170px;object-fit:cover;background:#0D0D0D;transition:transform 0.5s}
        .menu-card:hover .menu-card-image{transform:scale(1.05)}
        .menu-card-image-overlay{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to top,rgba(26,26,26,0.9),transparent)}
        .no-image-icon{width:100%;height:170px;display:flex;align-items:center;justify-content:center;background:#0D0D0D;color:var(--gray);font-size:2.5rem}
        .menu-card-content{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
        .menu-card-name{font-weight:600;font-size:0.9rem;color:white;line-height:1.3;flex:1}
        .menu-card-price{color:var(--gold);font-weight:700;font-size:1rem;white-space:nowrap;padding:7px 14px;background:rgba(201,169,110,0.1);border-radius:30px;transition:0.3s}
        .menu-card:hover .menu-card-price{background:var(--gold);color:#0A0A0A}

        .stats-bar{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;padding:20px;background:var(--dark-card);border-radius:18px;margin-top:30px;border:1px solid var(--border)}
        .stat-item{display:flex;align-items:center;gap:8px;color:var(--gray-light);font-size:0.85rem}
        .stat-item i{color:var(--gold)}.stat-item strong{color:white}
        .stat-divider{width:1px;height:18px;background:var(--border)}

        .footer{background:#020202;text-align:center;padding:35px 20px;margin-top:40px;border-top:1px solid rgba(201,169,110,0.1)}
        .footer p{color:var(--gray);margin:5px 0;font-size:0.85rem}
        .footer a{color:var(--gold);text-decoration:none;font-weight:500;transition:0.3s}
        .footer a:hover{color:var(--gold-light)}

        .floating-telegram{position:fixed;bottom:30px;left:30px;background:#0088cc;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:white;text-decoration:none;box-shadow:0 8px 25px rgba(0,136,204,0.35);transition:0.3s;z-index:999;border:2px solid white;animation:bounce 2s ease-in-out infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        .floating-telegram:hover{transform:scale(1.12);background:#0077b3;animation:none}

        .back-to-top{position:fixed;bottom:30px;right:30px;background:var(--gold);color:#0A0A0A;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transition:0.3s;z-index:998;border:none;font-size:1.1rem;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
        .back-to-top.visible{opacity:1;visibility:visible}
        .back-to-top:hover{background:var(--gold-dark);transform:translateY(-3px)}

        .loading-spinner{display:flex;align-items:center;justify-content:center;padding:50px}
        .spinner{width:45px;height:45px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:768px){
            .nav-links{display:none}
            .menu-hero{padding:45px 15px 35px}
            .menu-hero h1{font-size:2.2rem}
            .menu-grid{grid-template-columns:1fr;gap:14px}
            .category-title{font-size:1.4rem}
            .filter-btn{padding:7px 15px;font-size:0.78rem}
            .floating-telegram{width:48px;height:48px;font-size:1.3rem;bottom:20px;left:20px}
            .back-to-top{width:38px;height:38px;bottom:20px;right:20px}
            .menu-card-image,.no-image-icon{height:150px}
            .stats-bar{gap:10px;padding:15px}
            .stat-divider{display:none}
        }
    </style>
</head>

<script>
// CONFIG
var REDIS_URL='https://proper-sunbeam-108020.upstash.io',REDIS_TOKEN='gQAAAAAAAaX0AAIgcDE3NThjODZkOGE0ZDg0ZGRiYjY2YWU4Nzc5M2MzZGU1Yw',REDIS_KEY='lantica:menu';
var GITHUB_BASE='https://raw.githubusercontent.com/developereth/Lantica/main/',PLACEHOLDER='https://placehold.co/400x170/1A1A1A/C9A96E?text=Lantica+1960';

var menuData={},currentFilter='all',currentSearch='';

// LOAD FROM REDIS
async function loadMenu(){
    try{
        var r=await fetch(REDIS_URL+'/get/'+REDIS_KEY,{headers:{'Authorization':'Bearer '+REDIS_TOKEN}});
        var d=await r.json();
        if(d.result){menuData=JSON.parse(decodeURIComponent(d.result));return}
    }catch(e){console.log('Redis unavailable, using local')}
    // Fallback
    menuData={"☀️ Breakfast":[{name:"Combo Fasting",price:250,image:"combo-fasting-platter.jpg"},{name:"Egg w/ meat",price:250,image:"egg-with-minced-meat.jpg"},{name:"Special Fetora",price:350,image:"special-fetera-honey-cheese.jpg"},{name:"Normal Fetora",price:200,image:"classic-fetera.webp"},{name:"Special Chech",price:250,image:""},{name:"Normal Foul",price:180,image:""},{name:"Special Foul",price:250,image:""},{name:"Tomato Cheese",price:170,image:"tomato-lebleb.jpg"},{name:"Egg Sandwich",price:200,image:"egg-sandwich.jpg"}],"🔥 Traditional Food":[{name:"Lamb Tibs",price:680,image:"lamb-tibs.jpg"},{name:"Lamb Tibs Tefresho",price:700,image:"lamb-tibs-tefersho.jpg"},{name:"Okie",price:600,image:""},{name:"Chikena Tibs",price:600,image:""},{name:"Chikena Tefresho",price:650,image:""},{name:"Kitto",price:1200,image:""},{name:"Quanta Firfir",price:370,image:"kuanta-firfir.jpeg"},{name:"Kiba Firfir",price:210,image:"kiba-firfir.webp"},{name:"Tibes Firfir",price:320,image:"tibis-firfir.jpg"},{name:"Shiro Bekibe",price:300,image:"shiro-bekibe.jpeg"},{name:"Dullet",price:330,image:"dulet-minced-tripe.jpeg"},{name:"Derkosh Firfir Beseg",price:380,image:""},{name:"Bozena Shiro",price:350,image:"shiro.jpg"},{name:"Mahberawi",price:1200,image:"mahberawi-mixed-platter.jpeg"},{name:"Yefisk Agelgel",price:1000,image:""},{name:"Gomen Kitto",price:300,image:"gomen-kitfo.jpg"}],"🍕 Pizza":[{name:"Special Lentic Pizza Large",price:580,image:""},{name:"Special Lentic Pizza Medium",price:550,image:""},{name:"Chicken Pizza Large",price:550,image:"chicken-pizza.jpeg"},{name:"Chicken Pizza Medium",price:460,image:"chicken-pizza.jpeg"},{name:"Margarita Large",price:450,image:"margherita-pizza.jpg"},{name:"Margarita Medium",price:400,image:"margherita-pizza.jpg"},{name:"Vegetable Pizza Large",price:370,image:""}],"🍝 Spaghetti & Rice":[{name:"Spaghetti with Vegetables",price:230,image:"pasta-with-veggies-25.jpg"},{name:"Rice",price:400,image:""}],"🍔 Burgers & Sandwiches":[{name:"Noma Burger",price:305,image:""},{name:"Cheese Burger",price:350,image:""},{name:"Noma Ketchup",price:380,image:""},{name:"Club Sandwich",price:360,image:""},{name:"Tuna Sandwich",price:350,image:""},{name:"Vegetable Sandwich",price:160,image:""},{name:"Chicken Shawarma",price:600,image:""},{name:"French Fries",price:180,image:""}],"🥩 Pork Selections":[{name:"Pork Chop",price:320,image:""},{name:"Pork Sausage",price:180,image:""},{name:"Pork Steak",price:570,image:""},{name:"Pork Loin",price:200,image:""},{name:"Pork Ribs",price:400,image:""},{name:"Pork Belly",price:380,image:""},{name:"Pork Shoulder",price:400,image:""}],"🥗 Soup & Salad":[{name:"Vegetable Soup",price:180,image:""},{name:"Mixed Salad",price:200,image:"mixed-garden-salad-2.jpg"},{name:"Chicken Salad",price:300,image:""}],"🍲 Fast Food":[{name:"Special Lantica Fasting",price:500,image:""},{name:"Normal Firfir",price:180,image:""},{name:"Shiro",price:275,image:"shiro.jpg"},{name:"Tegabino",price:300,image:"tegabino.jpg"},{name:"Derkosh Firfir Fasting",price:220,image:""},{name:"Mesere",price:250,image:"mesere-red-lentil.jpeg"},{name:"Hafe Hafe",price:280,image:""}],"🥤 Fresh Juices":[{name:"Papaya Juice",price:160,image:"papaya-juice.jpg"},{name:"Avocado Juice",price:160,image:"avocado-juice.png"},{name:"Mango Juice",price:160,image:"mango-juice.jpeg"},{name:"Telba Juice",price:200,image:"tella-juice.webp"}],"🧊 Cold Drinks":[{name:"1/4 Water",price:20,image:""},{name:"1/2 Water",price:35,image:""},{name:"1 Liter Water",price:55,image:"ambo-water.jpeg"},{name:"2 Liter Water",price:75,image:"ambo-water.jpeg"},{name:"Soft Drink",price:60,image:"soft-drink.jpeg"},{name:"Ambo Water",price:65,image:"ambo-water.jpeg"},{name:"Plastic Soft Drink",price:70,image:"soft-drink.jpeg"},{name:"Tonic Water",price:80,image:""}],"🍺 Beer & Draft":[{name:"Normal Beer",price:100,image:""},{name:"Big Bedla",price:120,image:""},{name:"Hicnek Beer",price:125,image:""},{name:"Arada Beer",price:130,image:""},{name:"Janibo",price:145,image:""},{name:"Single Draft",price:65,image:""}],"🍷 Wine List":[{name:"Axmite",price:900,image:""},{name:"Guder Big",price:720,image:""},{name:"Kmila Big",price:800,image:""},{name:"Gebeta",price:1100,image:""},{name:"Aksejar",price:1200,image:""}],"☕ Hot Beverages":[{name:"Tea",price:30,image:""},{name:"Coffee",price:60,image:"ethiopian-coffee-Buna.jpeg"},{name:"Milk",price:80,image:""},{name:"Latte",price:70,image:"Latte.jpg"},{name:"Macchiato",price:75,image:"mackiyato.jpg"},{name:"Spires",price:60,image:""},{name:"Lewis Tea",price:75,image:""},{name:"Kesher",price:50,image:""},{name:"Tea with Lemon",price:45,image:""},{name:"Flavor Tea",price:65,image:""},{name:"Special Tea",price:150,image:""},{name:"Fasting Macchiato",price:85,image:""},{name:"Hot Chocolate",price:80,image:"hot-chocolate.jpg"}]};
}

function getCats(){return Object.keys(menuData)}
function getTotal(){var t=0;for(var k in menuData)t+=menuData[k].length;return t}

function renderFilters(){
    var cats=getCats(),h='<button class="filter-btn '+(currentFilter=='all'?'active':'')+'" onclick="setFilter(\'all\')">All</button>';
    cats.forEach(function(c){h+='<button class="filter-btn '+(currentFilter==c?'active':'')+'" onclick="setFilter(\''+esc(c)+'\')">'+c+'</button>'});
    document.getElementById('categoryFilters').innerHTML=h;
}
function setFilter(c){currentFilter=c;renderFilters();renderMenu();document.getElementById('menuContainer').scrollIntoView({behavior:'smooth',block:'start'})}
function setSearch(){currentSearch=document.getElementById('searchInput').value.toLowerCase();renderMenu()}

function getImgUrl(img){
    if(!img||img==='')return null;
    if(img.startsWith('http'))return img;
    return GITHUB_BASE+img;
}

function renderMenu(){
    var cats=getCats(),c=document.getElementById('menuContainer'),total=0,h='';
    for(var i=0;i<cats.length;i++){
        var cat=cats[i];
        if(currentFilter!='all'&&currentFilter!=cat)continue;
        var items=menuData[cat];
        if(currentSearch)items=items.filter(function(item){return item.name.toLowerCase().includes(currentSearch)});
        if(!items.length)continue;
        h+='<div class="menu-category"><div class="category-title">'+cat+'<span class="category-count">'+items.length+' items</span></div><div class="menu-grid">';
        items.forEach(function(item){
            total++;var img=getImgUrl(item.image);
            if(img)h+='<div class="menu-card"><div class="menu-card-image-wrapper"><img class="menu-card-image" src="'+img+'" alt="'+esc(item.name)+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=no-image-icon><i class=fas fa-utensils></i></div>\'"><div class="menu-card-image-overlay"></div></div><div class="menu-card-content"><span class="menu-card-name">'+esc(item.name)+'</span><span class="menu-card-price">'+item.price+' ETB</span></div></div>';
            else h+='<div class="menu-card"><div class="no-image-icon"><i class="fas fa-utensils"></i></div><div class="menu-card-content"><span class="menu-card-name">'+esc(item.name)+'</span><span class="menu-card-price">'+item.price+' ETB</span></div></div>';
        });
        h+='</div></div>';
    }
    if(!h)h='<div style="text-align:center;padding:50px"><i class="fas fa-search" style="font-size:3rem;color:var(--gold);opacity:0.5;margin-bottom:15px;display:block"></i><h3 style="color:white;margin-bottom:8px">No items found</h3><p style="color:var(--gray)">Try a different search</p></div>';
    c.innerHTML=h;
    document.getElementById('stats').innerHTML='<div class="stat-item"><i class="fas fa-layer-group"></i><strong>'+cats.length+'</strong> Categories</div><div class="stat-divider"></div><div class="stat-item"><i class="fas fa-utensils"></i><strong>'+getTotal()+'</strong> Total Items</div><div class="stat-divider"></div><div class="stat-item"><i class="fas fa-eye"></i> Showing <strong>'+total+'</strong></div><div class="stat-divider"></div><div class="stat-item"><i class="fas fa-phone"></i> Order: <strong>+251 94 1270 797</strong></div>';
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Back to top
window.addEventListener('scroll',function(){document.getElementById('backToTop').classList.toggle('visible',window.scrollY>500)});
document.getElementById('searchInput').addEventListener('keyup',setSearch);

// INIT
loadMenu().then(function(){renderFilters();renderMenu()});
</script>
