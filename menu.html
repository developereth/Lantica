<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lantica 1960 | Complete Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #E8E0D5;
        }
        :root {
            --gold: #C9A96E;
            --gold-dark: #B8933F;
            --red: #B45F3B;
            --dark-card: #1A1A1A;
            --gray: #9B8A74;
            --gray-light: #D1C5B5;
        }

        .navbar {
            background: rgba(13,13,13,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
        }

        .logo-text span { color: var(--gold); }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--gray-light);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--gold); }

        .menu-header {
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%),
                url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600&q=80') center/cover no-repeat;
            text-align: center;
            padding: 80px 20px;
        }

        .menu-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
        }

        .menu-header h1 span { color: var(--gold); }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .search-bar {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .search-input {
            padding: 14px 20px;
            width: 350px;
            background: var(--dark-card);
            border: 1px solid #2C2823;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: var(--dark-card);
            border: 1px solid #2C2823;
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--gray-light);
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gold);
            color: #0A0A0A;
        }

        .menu-category {
            margin-bottom: 50px;
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 25px;
            border-left: 4px solid var(--gold);
            padding-left: 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .menu-item {
            background: var(--dark-card);
            padding: 18px 22px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2C2823;
            transition: 0.3s;
        }

        .menu-item:hover {
            border-color: var(--gold);
            transform: translateX(5px);
        }

        .item-name { font-weight: 500; }
        .item-price { color: var(--gold); font-weight: 700; }

        .stats {
            text-align: center;
            padding: 20px;
            background: var(--dark-card);
            border-radius: 20px;
            margin-top: 30px;
        }

        .footer {
            background: #020202;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }

        .footer a {
            color: var(--gold);
            text-decoration: none;
        }

        .floating-telegram {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #0088cc;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
            z-index: 999;
            border: 2px solid white;
        }

        .floating-telegram:hover {
            transform: scale(1.1);
            background: #0077b3;
        }

        @media (max-width: 700px) {
            .menu-grid { grid-template-columns: 1fr; }
            .menu-header h1 { font-size: 2rem; }
            .category-title { font-size: 1.4rem; }
            .navbar { flex-direction: column; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
            .floating-telegram { width: 50px; height: 50px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<a href="https://t.me/+251941270797" target="_blank" class="floating-telegram">
    <i class="fab fa-telegram-plane"></i>
</a>

<nav class="navbar">
    <a href="index.html" class="logo">
        <div class="logo-circle">
            <img src="https://raw.githubusercontent.com/developereth/Lantica/main/logo.jpg" alt="Lantica 1960">
        </div>
        <div class="logo-text">LANTICA <span>1960</span></div>
    </a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" style="color: var(--gold);">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#events">Events</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
</nav>

<section class="menu-header">
    <h1>Our <span>Complete Menu</span></h1>
    <p style="color: var(--gray-light); margin-top: 10px;">📍 Arat Kilo, Addis Ababa | Since 1996</p>
</section>

<div class="container">
    <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search menu items...">
    </div>

    <div class="category-filter" id="categoryFilters"></div>
    <div id="menuContainer"></div>
    <div class="stats" id="stats"></div>
</div>

<footer class="footer">
    <p>📍 Arat Kilo, Addis Ababa | 📞 +251 94 1270 797</p>
    <p style="margin-top: 10px;">Powered by <a href="https://addispower.pages.dev/" target="_blank">AddisPower</a></p>
</footer>

<script>
    const menuData = {
        "☀️ Breakfast": [
            "Combo Fasting - 250", "Egg w/ meat - 250", "Special Fetora - 350",
            "Normal Fetora - 200", "Special Chech - 250", "Normal Foul - 180",
            "Special Foul - 250", "Tomato Cheese - 170", "Egg Sandwich - 200"
        ],
        "🔥 Traditional Food": [
            "Lamb Tibs - 680", "Lamb Tibs Tefresho - 700", "Okie - 600",
            "Chikena Tibs - 600", "Chikena Tefresho - 650", "Kitto - 1200",
            "Quanta Firfir - 370", "Kiba Firfir - 210", "Tibes Firfir - 320",
            "Shiro Bekibe - 300", "Dullet - 330", "Derkosh Firfir Beseg - 380",
            "Bozena Shiro - 350", "Mahberawi - 1200", "Yefisk Agelgel - 1000", "Gomen Kitto - 300"
        ],
        "🍕 Pizza": [
            "Special Lentic Pizza Large - 580", "Special Lentic Pizza Medium - 550",
            "Chicken Pizza Large - 550", "Chicken Pizza Medium - 460",
            "Margarita Large - 450", "Margarita Medium - 400", "Vegetable Pizza Large - 370"
        ],
        "🍝 Spaghetti & Rice": ["Spaghetti with Vegetables - 230", "Rice - 400"],
        "🍔 Burgers & Sandwiches": [
            "Noma Burger - 305", "Cheese Burger - 350", "Noma Ketchup - 380",
            "Club Sandwich - 360", "Tuna Sandwich - 350", "Vegetable Sandwich - 160",
            "Chicken Shawarma - 600", "French Fries - 180"
        ],
        "🥩 Pork Selections": [
            "Pork Chop - 320", "Pork Sausage - 180", "Pork Steak - 570",
            "Pork Loin - 200", "Pork Ribs - 400", "Pork Belly - 380", "Pork Shoulder - 400"
        ],
        "🥗 Soup & Salad": ["Vegetable Soup - 180", "Mixed Salad - 200", "Chicken Salad - 300"],
        "🍲 Fast Food": [
            "Special Lantica Fasting - 500", "Normal Firfir - 180", "Shiro - 275",
            "Tegabino - 300", "Derkosh Firfir Fasting - 220", "Mesere - 250", "Hafe Hafe - 280"
        ],
        "🥤 Fresh Juices": ["Papaya Juice - 160", "Avocado Juice - 160", "Mango Juice - 160", "Telba Juice - 200"],
        "🧊 Cold Drinks": [
            "1/4 Water - 20", "1/2 Water - 35", "1 Liter Water - 55", "2 Liter Water - 75",
            "Soft Drink - 60", "Ambo Water - 65", "Plastic Soft Drink - 70", "Tonic Water - 80"
        ],
        "🍺 Beer & Draft": ["Normal Beer - 100", "Big Bedla - 120", "Hicnek Beer - 125", "Arada Beer - 130", "Janibo - 145", "Single Draft - 65"],
        "🍷 Wine List": ["Axmite - 900", "Guder Big - 720", "Kmila Big - 800", "Gebeta - 1100", "Aksejar - 1200"],
        "☕ Hot Beverages": [
            "Tea - 30", "Coffee - 60", "Milk - 80", "Latte - 70", "Macchiato - 75",
            "Spires - 60", "Lewis Tea - 75", "Kesher - 50", "Tea with Lemon - 45",
            "Flavor Tea - 65", "Special Tea - 150", "Fasting Macchiato - 85", "Hot Chocolate - 80"
        ]
    };

    let currentFilter = "all";
    let currentSearch = "";

    function getCategories() { return Object.keys(menuData); }

    function renderFilters() {
        const categories = getCategories();
        let html = `<button class="filter-btn ${currentFilter === "all" ? "active" : ""}" onclick="setFilter('all')">All</button>`;
        categories.forEach(cat => {
            html += `<button class="filter-btn ${currentFilter === cat ? "active" : ""}" onclick="setFilter('${cat}')">${cat}</button>`;
        });
        document.getElementById("categoryFilters").innerHTML = html;
    }

    function setFilter(category) {
        currentFilter = category;
        renderFilters();
        renderMenu();
    }

    function setSearch() {
        currentSearch = document.getElementById("searchInput").value.toLowerCase();
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById("menuContainer");
        const categories = getCategories();
        let totalItems = 0;
        let html = "";

        for (const category of categories) {
            if (currentFilter !== "all" && currentFilter !== category) continue;
            const items = menuData[category];
            let filteredItems = currentSearch ? items.filter(item => item.toLowerCase().includes(currentSearch)) : items;
            if (filteredItems.length === 0) continue;

            html += `<div class="menu-category"><div class="category-title">${category}</div><div class="menu-grid">`;
            filteredItems.forEach(item => {
                totalItems++;
                let parts = item.split(" - ");
                html += `<div class="menu-item"><span class="item-name">${parts[0]}</span><span class="item-price">${parts[1]} ETB</span></div>`;
            });
            html += `</div></div>`;
        }

        if (html === "") html = `<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:3rem;color:var(--gold);"></i><h3>No items found</h3></div>`;
        container.innerHTML = html;
        document.getElementById("stats").innerHTML = `<i class="fas fa-list"></i> Showing ${totalItems} menu items | 📞 Order: +251 94 1270 797`;
    }

    document.getElementById("searchInput").addEventListener("keyup", setSearch);
    renderFilters();
    renderMenu();
</script>
</body>
</html>
