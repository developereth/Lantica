function getCats() { return Object.keys(menuData); }

function getTotal() { 
    var t = 0; 
    for (var k in menuData) t += menuData[k].length; 
    return t; 
}

function renderFilters() {
    var cats = getCats();
    var h = '<button class="filter-btn ' + (currentFilter == 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">All</button>';
    cats.forEach(function(c) {
        h += '<button class="filter-btn ' + (currentFilter == c ? 'active' : '') + '" onclick="setFilter(\'' + esc(c) + '\')">' + c + '</button>';
    });
    document.getElementById('categoryFilters').innerHTML = h;
}

function setFilter(c) { 
    currentFilter = c; 
    renderFilters(); 
    renderMenu(); 
}

function setSearch() { 
    currentSearch = document.getElementById('searchInput').value.toLowerCase(); 
    renderMenu(); 
}

function getImgUrl(img) {
    if (!img || img === '') return null;
    if (img.startsWith('http')) return img;
    return PLACEHOLDER;
}

function renderMenu() {
    var cats = getCats();
    var container = document.getElementById('menuContainer');
    var total = 0;
    var html = '';
    
    for (var i = 0; i < cats.length; i++) {
        var cat = cats[i];
        if (currentFilter != 'all' && currentFilter != cat) continue;
        
        var items = menuData[cat];
        if (currentSearch) {
            items = items.filter(function(item) {
                return item.name.toLowerCase().includes(currentSearch);
            });
        }
        if (!items.length) continue;
        
        html += '<div class="menu-category">';
        html += '<div class="category-title">' + cat + '<span class="category-count">' + items.length + ' items</span></div>';
        html += '<div class="menu-grid">';
        
        items.forEach(function(item) {
            total++;
            var img = getImgUrl(item.image);
            
            if (img) {
                html += '<div class="menu-card">';
                html += '<div class="menu-card-image-wrapper">';
                html += '<img class="menu-card-image" src="' + img + '" alt="' + esc(item.name) + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=no-image-icon><i class=fas fa-utensils></i></div>\'">';
                html += '<div class="menu-card-image-overlay"></div>';
                html += '</div>';
                html += '<div class="menu-card-content">';
                html += '<span class="menu-card-name">' + esc(item.name) + '</span>';
                html += '<span class="menu-card-price">' + item.price + ' ETB</span>';
                html += '</div></div>';
            } else {
                html += '<div class="menu-card">';
                html += '<div class="no-image-icon"><i class="fas fa-utensils"></i></div>';
                html += '<div class="menu-card-content">';
                html += '<span class="menu-card-name">' + esc(item.name) + '</span>';
                html += '<span class="menu-card-price">' + item.price + ' ETB</span>';
                html += '</div></div>';
            }
        });
        
        html += '</div></div>';
    }
    
    if (!html) {
        html = '<div style="text-align:center;padding:50px">';
        html += '<i class="fas fa-search" style="font-size:3rem;color:var(--gold);opacity:0.5;margin-bottom:15px;display:block"></i>';
        html += '<h3 style="color:white;margin-bottom:8px">No items found</h3>';
        html += '<p style="color:var(--gray)">Try a different search</p>';
        html += '</div>';
    }
    
    container.innerHTML = html;
    
    document.getElementById('stats').innerHTML = 
        '<div class="stat-item"><i class="fas fa-layer-group"></i><strong>' + cats.length + '</strong> Categories</div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><i class="fas fa-utensils"></i><strong>' + getTotal() + '</strong> Total Items</div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><i class="fas fa-eye"></i> Showing <strong>' + total + '</strong></div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><i class="fas fa-phone"></i> Order: <strong>+251 94 1270 797</strong></div>';
}

function esc(s) { 
    if (!s) return ''; 
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); 
}

// Event Listeners
window.addEventListener('scroll', function() {
    document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 500);
});

document.getElementById('searchInput').addEventListener('keyup', setSearch);

// Initialize
loadMenu().then(function() {
    renderFilters();
    renderMenu();
    console.log('✅ Menu rendered successfully');
});
</script>
