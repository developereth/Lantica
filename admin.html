<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E8E0D5;padding:20px}
        :root{--gold:#C9A96E;--dark-card:#1A1A1A;--border:#2C2823}
        .container{max-width:1200px;margin:0 auto}
        .login-box{background:var(--dark-card);padding:40px;border-radius:18px;max-width:400px;margin:100px auto;text-align:center;border:1px solid var(--border)}
        .login-box h2{color:var(--gold);margin-bottom:20px;font-family:'Playfair Display',serif}
        .login-box input{width:100%;padding:14px;background:#0A0A0A;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .login-box input:focus{outline:none;border-color:var(--gold)}
        .hidden{display:none!important}
        h1{color:var(--gold);margin-bottom:20px;text-align:center;font-family:'Playfair Display',serif}
        .card{background:var(--dark-card);padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid var(--border)}
        h2{color:var(--gold);margin-bottom:15px}
        .row{display:flex;gap:12px;margin-bottom:12px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#0A0A0A;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px;font-family:inherit;transition:0.3s}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:0.9rem}
        .btn-gold{background:var(--gold);color:#0A0A0A}.btn-gold:hover{background:#B8933F}
        .btn-red{background:#c0392b;color:#fff}.btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed var(--gold);padding:20px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:0.3s}
        .upload-box:hover{background:#0A0A0A;border-color:#fff}
        .preview-row{display:flex;gap:15px;margin-bottom:12px}
        .preview-row img{width:100px;height:100px;object-fit:cover;border-radius:8px;display:none}
        .status-row{display:flex;gap:15px;margin-bottom:12px;font-size:0.75rem;color:var(--gold)}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600;animation:fadeIn 0.3s}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .item-row{display:flex;align-items:center;gap:15px;padding:12px;background:#0A0A0A;border-radius:8px;margin-bottom:8px;border:1px solid var(--border);transition:0.3s}
        .item-row:hover{background:#111}
        .item-row img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1}.item-row .info h3{color:var(--gold);font-size:0.9rem}.item-row .info p{color:#888;font-size:0.75rem}
        .search-box{width:100%;padding:12px;background:#0A0A0A;border:2px solid var(--gold);border-radius:25px;color:#fff;margin-bottom:15px}
        .edit-form{display:none;background:#0A0A0A;padding:20px;border-radius:8px;margin:10px 0;border:1px solid var(--gold);animation:slideDown 0.3s}
        .edit-form.show{display:block}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
        .stat{background:var(--dark-card);padding:15px;border-radius:8px;text-align:center;border:1px solid var(--border)}
        .stat .num{font-size:1.5rem;font-weight:700;color:var(--gold)}.stat .lbl{font-size:0.7rem;color:#888;margin-top:3px}
        @media(max-width:768px){.row{flex-direction:column}.stats{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
<div id="loginScreen" class="login-box">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="pw" placeholder="Enter Password" onkeypress="if(event.key==='Enter')login()">
    <button class="btn-gold" onclick="login()">Access Admin</button>
    <p id="loginErr" style="color:#e74c3c;margin-top:10px;display:none">❌ Wrong password</p>
</div>

<div id="panel" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h1>🍽️ Menu Admin</h1>
    <button class="btn-red" onclick="logout()" style="padding:8px 16px">🚪 Logout</button>
</div>

<div class="stats">
    <div class="stat"><div class="num" id="statCats">0</div><div class="lbl">Categories</div></div>
    <div class="stat"><div class="num" id="statItems">0</div><div class="lbl">Total Items</div></div>
    <div class="stat"><div class="num" id="statImg">0</div><div class="lbl">With Images</div></div>
</div>

<div class="card">
    <h2>➕ Add Menu Item</h2>
    <div class="upload-box" onclick="document.getElementById('f1').click()">
        <div style="font-size:28px">📷</div>
        <div style="font-size:0.7rem;color:#888">Upload Image (optional)</div>
    </div>
    <input type="file" id="f1" accept="image/*" style="display:none" onchange="addImg()">
    <div class="preview-row"><img id="pv1"></div>
    <div class="status-row" id="st1"></div>
    <input type="hidden" id="u1">
    
    <div class="row">
        <input type="text" id="iname" placeholder="Item Name *">
        <input type="number" id="iprice" placeholder="Price (ETB) *">
    </div>
    <div class="row">
        <select id="icategory">
            <option value="">Select Category</option>
            <option value="☀️ Breakfast">☀️ Breakfast</option>
            <option value="🔥 Traditional Food">🔥 Traditional Food</option>
            <option value="🍕 Pizza">🍕 Pizza</option>
            <option value="🍝 Spaghetti & Rice">🍝 Spaghetti & Rice</option>
            <option value="🍔 Burgers & Sandwiches">🍔 Burgers & Sandwiches</option>
            <option value="🥩 Pork Selections">🥩 Pork Selections</option>
            <option value="🥗 Soup & Salad">🥗 Soup & Salad</option>
            <option value="🍲 Fast Food">🍲 Fast Food</option>
            <option value="🥤 Fresh Juices">🥤 Fresh Juices</option>
            <option value="🧊 Cold Drinks">🧊 Cold Drinks</option>
            <option value="🍺 Beer & Draft">🍺 Beer & Draft</option>
            <option value="🍷 Wine List">🍷 Wine List</option>
            <option value="☕ Hot Beverages">☕ Hot Beverages</option>
        </select>
        <input type="text" id="inewcat" placeholder="Or new category name">
    </div>
    <button class="btn-gold" onclick="addItem()">✅ Add Item</button>
    <div id="msg" class="msg"></div>
</div>

<div class="edit-form" id="editForm">
    <h2>✏️ Edit Item</h2>
    <input type="hidden" id="editId">
    <input type="hidden" id="editOldCat">
    
    <div class="upload-box" onclick="document.getElementById('ef1').click()">
        <div style="font-size:28px">📷</div>
        <div style="font-size:0.7rem;color:#888">Change Image</div>
    </div>
    <input type="file" id="ef1" accept="image/*" style="display:none" onchange="editImg()">
    <div class="preview-row"><img id="ep1"></div>
    <div class="status-row" id="es1"></div>
    <input type="hidden" id="eu1">
    
    <div class="row">
        <input type="text" id="ename" placeholder="Name">
        <input type="number" id="eprice" placeholder="Price">
    </div>
    <div class="row">
        <select id="ecategory">
            <option value="☀️ Breakfast">☀️ Breakfast</option>
            <option value="🔥 Traditional Food">🔥 Traditional Food</option>
            <option value="🍕 Pizza">🍕 Pizza</option>
            <option value="🍝 Spaghetti & Rice">🍝 Spaghetti & Rice</option>
            <option value="🍔 Burgers & Sandwiches">🍔 Burgers & Sandwiches</option>
            <option value="🥩 Pork Selections">🥩 Pork Selections</option>
            <option value="🥗 Soup & Salad">🥗 Soup & Salad</option>
            <option value="🍲 Fast Food">🍲 Fast Food</option>
            <option value="🥤 Fresh Juices">🥤 Fresh Juices</option>
            <option value="🧊 Cold Drinks">🧊 Cold Drinks</option>
            <option value="🍺 Beer & Draft">🍺 Beer & Draft</option>
            <option value="🍷 Wine List">🍷 Wine List</option>
            <option value="☕ Hot Beverages">☕ Hot Beverages</option>
        </select>
        <input type="text" id="enewcat" placeholder="Or new category">
    </div>
    <button class="btn-green" id="saveEditBtn" onclick="saveEdit()">💾 Save Changes</button>
    <button class="btn-red" onclick="cancelEdit()">Cancel</button>
</div>

<div class="card">
    <h2>📋 Menu Items</h2>
    <input type="text" class="search-box" placeholder="🔍 Search items..." id="sp" oninput="renderItems()">
    <div id="pList">Loading...</div>
</div>
</div>
</div>

<script>
// Configuration - UPDATE THESE
var API_URL = 'https://lantica-api.your-subdomain.workers.dev/api'; // Your Workers URL
var CLOUD_NAME = 'dm6rwo1ox'; // Your Cloudinary cloud name
var UPLOAD_PRESET = 'lantica_preset'; // Create this in Cloudinary
var ADMIN_PASSWORD = 'Lantica1960Admin'; // Change this!

var menuData = {};

function login() {
    if (document.getElementById('pw').value === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        loadMenu();
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

function logout() {
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

async function cloudUpload(file, pvId, stId, uId) {
    var s = document.getElementById(stId);
    s.textContent = 'Uploading...';
    var fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    
    try {
        var r = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
            method: 'POST',
            body: fd
        });
        var d = await r.json();
        if (d.secure_url) {
            document.getElementById(uId).value = d.secure_url;
            document.getElementById(pvId).src = d.secure_url;
            document.getElementById(pvId).style.display = 'block';
            s.textContent = '✅ Ready';
        } else {
            s.textContent = '❌ Failed';
        }
    } catch (e) {
        s.textContent = '❌ Error';
    }
}

function addImg() {
    var f = document.getElementById('f1').files[0];
    if (f) cloudUpload(f, 'pv1', 'st1', 'u1');
}

function editImg() {
    var f = document.getElementById('ef1').files[0];
    if (f) cloudUpload(f, 'ep1', 'es1', 'eu1');
}

async function loadMenu() {
    try {
        var r = await fetch(API_URL + '/menu');
        var d = await r.json();
        menuData = d.menu || {};
        updateStats();
        renderItems();
    } catch (e) {
        showMsg('msg', '❌ Failed to load menu', 'error');
    }
}

function updateStats() {
    var cats = Object.keys(menuData);
    var total = 0, withImg = 0;
    cats.forEach(cat => {
        total += menuData[cat].length;
        menuData[cat].forEach(item => {
            if (item.image && item.image !== '') withImg++;
        });
    });
    document.getElementById('statCats').textContent = cats.length;
    document.getElementById('statItems').textContent = total;
    document.getElementById('statImg').textContent = withImg;
}

function renderItems() {
    var search = (document.getElementById('sp')?.value || '').toLowerCase();
    var container = document.getElementById('pList');
    var html = '';
    
    for (var cat in menuData) {
        var items = menuData[cat];
        if (search) {
            items = items.filter(item => 
                item.name.toLowerCase().includes(search) || 
                cat.toLowerCase().includes(search)
            );
        }
        if (items.length === 0) continue;
        
        html += '<h3 style="color:#C9A96E;margin:15px 0 10px">' + cat + ' (' + items.length + ')</h3>';
        items.forEach(item => {
            html += '<div class="item-row">' +
                (item.image ? '<img src="' + item.image + '" onerror="this.src=\'https://placehold.co/50/1A1A1A/C9A96E?text=🍽\'">' : '<div style="width:50px;height:50px;background:#0A0A0A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🍽️</div>') +
                '<div class="info"><h3>' + item.name + '</h3><p>' + item.price + ' ETB | ' + cat + '</p></div>' +
                '<button class="btn-blue" onclick="editItem(\'' + item.id + '\')" style="margin-right:5px">✏️</button>' +
                '<button class="btn-red" onclick="deleteItem(\'' + item.id + '\')">🗑️</button>' +
                '</div>';
        });
    }
    
    if (!html) html = '<p style="text-align:center;color:#888;padding:30px">No items found</p>';
    container.innerHTML = html;
}

async function addItem() {
    var name = document.getElementById('iname').value.trim();
    var price = document.getElementById('iprice').value.trim();
    var category = document.getElementById('icategory').value;
    var newCat = document.getElementById('inewcat').value.trim();
    var image = document.getElementById('u1').value;
    
    if (!name || !price) {
        showMsg('msg', '❌ Fill name and price', 'error');
        return;
    }
    if (!category && !newCat) {
        showMsg('msg', '❌ Select or enter category', 'error');
        return;
    }
    
    var finalCat = newCat || category;
    
    try {
        var r = await fetch(API_URL + '/menu', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: finalCat,
                name: name,
                price: parseInt(price),
                image: image
            })
        });
        var d = await r.json();
        
        if (d.success) {
            showMsg('msg', '✅ Item added!', 'success');
            document.getElementById('iname').value = '';
            document.getElementById('iprice').value = '';
            document.getElementById('icategory').value = '';
            document.getElementById('inewcat').value = '';
            document.getElementById('u1').value = '';
            document.getElementById('pv1').style.display = 'none';
            document.getElementById('st1').textContent = '';
            document.getElementById('f1').value = '';
            loadMenu();
        } else {
            showMsg('msg', '❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch (e) {
        showMsg('msg', '❌ Error: ' + e.message, 'error');
    }
}

function editItem(id) {
    var item = null, catName = '';
    for (var cat in menuData) {
        var found = menuData[cat].find(i => i.id === id);
        if (found) {
            item = found;
            catName = cat;
            break;
        }
    }
    if (!item) return;
    
    document.getElementById('editId').value = item.id;
    document.getElementById('editOldCat').value = catName;
    document.getElementById('ename').value = item.name;
    document.getElementById('eprice').value = item.price;
    document.getElementById('ecategory').value = catName;
    document.getElementById('enewcat').value = '';
    document.getElementById('eu1').value = item.image || '';
    
    if (item.image) {
        document.getElementById('ep1').src = item.image;
        document.getElementById('ep1').style.display = 'block';
    } else {
        document.getElementById('ep1').style.display = 'none';
    }
    
    document.getElementById('es1').textContent = '';
    document.getElementById('ef1').value = '';
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
}

function cancelEdit() {
    document.getElementById('editForm').classList.remove('show');
}

async function saveEdit() {
    var id = document.getElementById('editId').value;
    var oldCat = document.getElementById('editOldCat').value;
    var name = document.getElementById('ename').value.trim();
    var price = document.getElementById('eprice').value.trim();
    var category = document.getElementById('ecategory').value;
    var newCat = document.getElementById('enewcat').value.trim();
    var image = document.getElementById('eu1').value;
    
    if (!name || !price) {
        alert('Fill all required fields');
        return;
    }
    
    var finalCat = newCat || category;
    var btn = document.getElementById('saveEditBtn');
    btn.textContent = 'Saving...';
    btn.disabled = true;
    
    try {
        var r = await fetch(API_URL + '/menu/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                price: parseInt(price),
                image: image,
                category: finalCat,
                oldCategory: oldCat
            })
        });
        var d = await r.json();
        
        btn.textContent = '💾 Save Changes';
        btn.disabled = false;
        
        if (d.success) {
            showMsg('msg', '✅ Updated!', 'success');
            cancelEdit();
            loadMenu();
        } else {
            showMsg('msg', '❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch (e) {
        btn.textContent = '💾 Save Changes';
        btn.disabled = false;
        showMsg('msg', '❌ Error: ' + e.message, 'error');
    }
}

async function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    
    try {
        await fetch(API_URL + '/menu/' + id, { method: 'DELETE' });
        loadMenu();
        showMsg('msg', '✅ Deleted', 'success');
    } catch (e) {
        showMsg('msg', '❌ Error: ' + e.message, 'error');
    }
}

function showMsg(id, text, type) {
    var m = document.getElementById(id);
    m.textContent = text;
    m.className = 'msg ' + type;
    setTimeout(() => m.className = 'msg', 3000);
}
</script>
</body>
</html>
