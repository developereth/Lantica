<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .hidden{display:none!important}
        h1{color:#C9A96E;margin-bottom:20px;font-size:1.8rem;text-align:center}
        .card{background:#111;padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:15px}
        .row{display:flex;gap:12px;margin-bottom:12px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px;font-family:inherit}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#C9A96E}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#C9A96E;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:20px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px}
        .preview-row{margin-bottom:12px}.preview-row img{width:100px;height:100px;object-fit:cover;border-radius:8px;display:none}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:15px;padding:12px;background:#1a1a1a;border-radius:8px;margin-bottom:8px;border:1px solid #333;flex-wrap:wrap}
        .item-row img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1;min-width:150px}.item-row .info h3{color:#C9A96E;font-size:0.9rem}.item-row .info p{color:#888;font-size:0.75rem}
        .search-box{width:100%;padding:12px;background:#1a1a1a;border:2px solid #C9A96E;border-radius:25px;color:#fff;margin-bottom:15px}
        .edit-form{display:none;background:#1a1a1a;padding:20px;border-radius:8px;margin:10px 0;border:1px solid #C9A96E}.edit-form.show{display:block}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
        .btn-sm{padding:8px 16px;font-size:0.85rem}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
<div class="top-bar"><h1 style="margin:0">🍽️ Lantica 1960 Admin</h1><div style="display:flex;gap:8px"><button class="btn-green btn-sm" onclick="saveData()">💾 Save</button><button class="btn-blue btn-sm" onclick="loadData()">🔄 Reload</button></div></div>

<div class="card"><h2>➕ Add Menu Item</h2>
<div class="upload-box" onclick="document.getElementById('f1').click()">📷 Upload to Cloudinary</div>
<input type="file" id="f1" accept="image/*" style="display:none" onchange="uploadImg()">
<div class="preview-row"><img id="pv1"><span id="st1" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="u1">
<div class="row"><input type="text" id="name" placeholder="Item Name *"><input type="number" id="price" placeholder="Price (ETB) *"></div>
<div class="row"><select id="category"><option value="">Select Category</option></select><input type="text" id="imageUrl" placeholder="Or paste image URL"></div>
<div class="row"><input type="text" id="newCat" placeholder="New category name"><button class="btn-gold btn-sm" onclick="addCategory()">+ Add Category</button></div>
<button class="btn-gold" onclick="addItem()">✅ Add Item</button><div id="msg" class="msg"></div>
</div>

<div class="edit-form" id="editForm"><h2>✏️ Edit Item</h2><input type="hidden" id="editId"><input type="hidden" id="editOrigCat">
<div class="upload-box" onclick="document.getElementById('ef1').click()">📷 Change Image</div>
<input type="file" id="ef1" accept="image/*" style="display:none" onchange="editUploadImg()">
<div class="preview-row"><img id="ep1"><span id="es1" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="eu1">
<div class="row"><input type="text" id="en" placeholder="Name"><input type="number" id="epr" placeholder="Price"></div>
<div class="row"><select id="ec"><option value="">Category</option></select><input type="text" id="eurl" placeholder="Image URL"></div>
<button class="btn-green" onclick="saveEdit()">💾 Save</button><button class="btn-red" onclick="cancelEdit()">Cancel</button></div>

<div class="card"><h2>📋 Menu Items</h2><input type="text" class="search-box" placeholder="🔍 Search..." id="sp" oninput="renderItems()"><div id="pList">Loading...</div></div>
</div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',API='https://lantica-menu.developeraddis.workers.dev/api/menu';
var menuData={};

// LOAD ON START
loadData();

async function loadData(){
    try{
        var r=await fetch(API);var d=await r.json();
        if(Object.keys(d).length>0&&!d.error){menuData=d}else{menuData={}}
        console.log('Loaded:',Object.keys(menuData).length,'categories');
        renderAll();
    }catch(e){console.log('Error:',e);menuData={};renderAll()}
}

async function saveData(){
    try{
        var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(menuData)});
        var d=await r.json();
        if(d.success){showMsg('msg','✅ Saved!','success')}else{showMsg('msg','❌ Failed','error')}
    }catch(e){showMsg('msg','❌ '+e.message,'error')}
}

async function uploadToCloudinary(file,previewId,statusId,hiddenId){
    var s=document.getElementById(statusId);s.textContent='Uploading...';
    var fd=new FormData();fd.append('file',file);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{
        var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});
        var d=await r.json();
        if(d.secure_url){
            document.getElementById(hiddenId).value=d.secure_url;
            document.getElementById(previewId).src=d.secure_url;
            document.getElementById(previewId).style.display='block';
            s.textContent='✅';s.style.color='#27ae60';
        }else{s.textContent='❌';s.style.color='#e74c3c'}
    }catch(e){s.textContent='❌';s.style.color='#e74c3c'}
}
function uploadImg(){var f=document.getElementById('f1').files[0];if(f)uploadToCloudinary(f,'pv1','st1','u1')}
function editUploadImg(){var f=document.getElementById('ef1').files[0];if(f)uploadToCloudinary(f,'ep1','es1','eu1')}

function getCats(){return Object.keys(menuData)}
function getAllItems(){var items=[];for(var k in menuData)menuData[k].forEach(function(item){items.push({...item,category:k})});return items}

function renderAll(){
    renderItems();
    var cats=getCats();
    var opts='<option value="">Select Category</option>';
    cats.forEach(function(c){opts+='<option value="'+esc(c)+'">'+c+'</option>'});
    document.getElementById('category').innerHTML=opts;
    document.getElementById('ec').innerHTML=opts;
}

function renderItems(){
    var search=(document.getElementById('sp')?.value||'').toLowerCase();
    var items=getAllItems();
    if(search)items=items.filter(function(i){return i.name.toLowerCase().indexOf(search)!==-1});
    var c=document.getElementById('pList');
    if(!items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No items yet. Add your first item above!</p>';return}
    c.innerHTML=items.map(function(p){
        var img=p.image;
        if(img&&!img.startsWith('http'))img='https://raw.githubusercontent.com/developereth/Lantica/main/'+img;
        if(!img)img='https://placehold.co/50/1A1A1A/C9A96E';
        return'<div class="item-row"><img src="'+img+'" onerror="this.src=\'https://placehold.co/50/1A1A1A/C9A96E\'"><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.category)+' | '+p.price+' ETB</p></div><button class="btn-blue btn-sm" onclick="editItem(\''+esc(p.category)+'\',\''+p.id+'\')">✏️</button><button class="btn-red btn-sm" onclick="deleteItem(\''+esc(p.category)+'\',\''+p.id+'\')">🗑️</button></div>';
    }).join('');
}

function addItem(){
    var n=document.getElementById('name').value.trim();
    var pr=parseInt(document.getElementById('price').value)||0;
    var cat=document.getElementById('category').value;
    var img=document.getElementById('u1').value||document.getElementById('imageUrl').value.trim();
    if(!n||!pr||!cat){showMsg('msg','❌ Fill name, price, category','error');return}
    if(!menuData[cat])menuData[cat]=[];
    var maxId=0;for(var k in menuData)menuData[k].forEach(function(i){if(parseInt(i.id)>maxId)maxId=parseInt(i.id)});
    menuData[cat].push({id:String(maxId+1),name:n,price:pr,image:img});
    document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('imageUrl').value='';
    document.getElementById('u1').value='';document.getElementById('pv1').style.display='none';document.getElementById('st1').textContent='';document.getElementById('f1').value='';
    saveData();renderAll();showMsg('msg','✅ Added!','success');
}

function editItem(cat,id){
    var p=menuData[cat].find(function(x){return x.id==id});if(!p)return;
    document.getElementById('editId').value=id;document.getElementById('editOrigCat').value=cat;
    document.getElementById('en').value=p.name;document.getElementById('epr').value=p.price;
    document.getElementById('ec').value=cat;document.getElementById('eurl').value=p.image||'';
    document.getElementById('eu1').value=p.image||'';
    if(p.image){
        var img=p.image.startsWith('http')?p.image:'https://raw.githubusercontent.com/developereth/Lantica/main/'+p.image;
        document.getElementById('ep1').src=img;document.getElementById('ep1').style.display='block';
    }else{document.getElementById('ep1').style.display='none'}
    document.getElementById('es1').textContent='';document.getElementById('ef1').value='';
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({behavior:'smooth'});
}
function cancelEdit(){document.getElementById('editForm').classList.remove('show')}
function saveEdit(){
    var id=document.getElementById('editId').value,ocat=document.getElementById('editOrigCat').value;
    var n=document.getElementById('en').value.trim(),pr=parseInt(document.getElementById('epr').value)||0;
    var cat=document.getElementById('ec').value,img=document.getElementById('eu1').value||document.getElementById('eurl').value.trim();
    var p=menuData[ocat].find(function(x){return x.id==id});if(!p)return;
    if(ocat===cat){p.name=n;p.price=pr;p.image=img}else{
        menuData[ocat]=menuData[ocat].filter(function(x){return x.id!=id});
        if(!menuData[cat])menuData[cat]=[];
        menuData[cat].push({id:id,name:n,price:pr,image:img});
        if(!menuData[ocat].length)delete menuData[ocat];
    }
    cancelEdit();saveData();renderAll();showMsg('msg','✅ Updated!','success');
}
function deleteItem(cat,id){
    if(!confirm('Delete this item?'))return;
    menuData[cat]=menuData[cat].filter(function(x){return x.id!=id});
    if(!menuData[cat].length)delete menuData[cat];
    saveData();renderAll();showMsg('msg','🗑️ Deleted','success');
}
function addCategory(){
    var n=document.getElementById('newCat').value.trim();
    if(!n)return;
    if(!menuData[n])menuData[n]=[];
    document.getElementById('newCat').value='';
    renderAll();showMsg('msg','✅ Category ready! Add items to it.','success');
}
function showMsg(id,t,type){var m=document.getElementById(id);m.textContent=t;m.className='msg '+type;setTimeout(function(){m.className='msg'},3000)}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
