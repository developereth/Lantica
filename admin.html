<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        h1{color:#C9A96E;margin-bottom:20px;font-size:1.5rem;text-align:center}
        .card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:12px;font-size:1.1rem}
        .row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
        input,select{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:8px}
        input:focus,select:focus{outline:none;border-color:#C9A96E}
        button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#C9A96E;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}.btn-orange{background:#e67e22;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:15px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px}
        .preview-row{margin-bottom:8px}.preview-row img{width:100px;height:100px;object-fit:cover;border-radius:8px;display:none}
        .msg{padding:10px;margin:8px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}.msg.info{background:#2980b9;display:block}
        .item-row{display:flex;align-items:center;gap:12px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #333;flex-wrap:wrap}
        .item-row img{width:45px;height:45px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1;min-width:120px}.item-row .info h3{color:#C9A96E;font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .search-box{width:100%;padding:10px;background:#1a1a1a;border:2px solid #C9A96E;border-radius:20px;color:#fff;margin-bottom:12px}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
        .btn-sm{padding:6px 14px;font-size:0.8rem}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
<div class="top-bar"><h1 style="margin:0">🍽️ Lantica 1960</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-orange btn-sm" onclick="loadDefaults()">🔄 Load All Defaults</button><button class="btn-green btn-sm" onclick="saveData()">💾 Save</button><button class="btn-blue btn-sm" onclick="loadData()">🔄 Reload</button></div></div>

<div class="card"><h2>➕ Add Menu Item</h2>
<div class="upload-box" onclick="document.getElementById('f1').click()">📷 Upload to Cloudinary</div>
<input type="file" id="f1" accept="image/*" style="display:none" onchange="uploadImg()">
<div class="preview-row"><img id="pv1"><span id="st1" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="u1">
<div class="row"><input type="text" id="name" placeholder="Item Name *"><input type="number" id="price" placeholder="Price (ETB) *"></div>
<div class="row"><select id="category"><option value="">Select Category</option></select><input type="text" id="imageUrl" placeholder="Or paste image URL"></div>
<div class="row"><input type="text" id="newCat" placeholder="New category (e.g. 🍕 Pizza)"><button class="btn-gold btn-sm" onclick="addCategory()">+ Add</button></div>
<button class="btn-gold" onclick="addItem()">✅ Add Item</button><div id="msg" class="msg"></div>
</div>

<div class="card"><h2>📋 Menu Items</h2><input type="text" class="search-box" placeholder="🔍 Search..." id="sp" oninput="renderItems()"><div id="pList">Loading...</div></div>
</div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',API='https://lantica-menu.developeraddis.workers.dev/api/menu';
var menuData={};

loadData();

async function loadData(){
    try{
        var r=await fetch(API);var d=await r.json();
        if(Object.keys(d).length>0){menuData=d;console.log('Loaded:',Object.keys(menuData).length,'categories')}
        else{console.log('Empty, loading defaults');loadDefaultsNoSave()}
        renderAll();
    }catch(e){console.log('Error');loadDefaultsNoSave();renderAll()}
}

function loadDefaultsNoSave(){
    menuData={
        "☀️ Breakfast":[{"id":"1","name":"Combo Fasting","price":250,"image":""},{"id":"2","name":"Egg w/ meat","price":250,"image":""},{"id":"3","name":"Special Fetora","price":350,"image":""},{"id":"4","name":"Normal Fetora","price":200,"image":""},{"id":"5","name":"Special Chech","price":250,"image":""},{"id":"6","name":"Normal Foul","price":180,"image":""},{"id":"7","name":"Special Foul","price":250,"image":""},{"id":"8","name":"Tomato Cheese","price":170,"image":""},{"id":"9","name":"Egg Sandwich","price":200,"image":""}],
        "🔥 Traditional Food":[{"id":"10","name":"Lamb Tibs","price":680,"image":""},{"id":"11","name":"Lamb Tibs Tefresho","price":700,"image":""},{"id":"12","name":"Okie","price":600,"image":""},{"id":"13","name":"Chikena Tibs","price":600,"image":""},{"id":"14","name":"Chikena Tefresho","price":650,"image":""},{"id":"15","name":"Kitto","price":1200,"image":""}],
        "🍕 Pizza":[{"id":"16","name":"Special Lentic Pizza Large","price":580,"image":""},{"id":"17","name":"Chicken Pizza Large","price":550,"image":""},{"id":"18","name":"Margarita Large","price":450,"image":""}],
        "🍔 Burgers & Sandwiches":[{"id":"19","name":"Noma Burger","price":305,"image":""},{"id":"20","name":"Cheese Burger","price":350,"image":""},{"id":"21","name":"Club Sandwich","price":360,"image":""}],
        "🥤 Fresh Juices":[{"id":"22","name":"Papaya Juice","price":160,"image":""},{"id":"23","name":"Avocado Juice","price":160,"image":""},{"id":"24","name":"Mango Juice","price":160,"image":""}],
        "☕ Hot Beverages":[{"id":"25","name":"Coffee","price":60,"image":""},{"id":"26","name":"Tea","price":30,"image":""},{"id":"27","name":"Macchiato","price":75,"image":""},{"id":"28","name":"Latte","price":70,"image":""}],
        "🍺 Beer & Draft":[{"id":"29","name":"Normal Beer","price":100,"image":""},{"id":"30","name":"Single Draft","price":65,"image":""}],
        "🍷 Wine List":[{"id":"31","name":"Axmite","price":900,"image":""},{"id":"32","name":"Guder Big","price":720,"image":""}]
    };
}

function loadDefaults(){
    loadDefaultsNoSave();
    saveData();
    renderAll();
    showMsg('msg','✅ Defaults loaded & saved!','info');
}

async function saveData(){
    try{
        var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(menuData)});
        var d=await r.json();
        if(d.success){showMsg('msg','✅ Saved!','success')}else{showMsg('msg','❌ Failed','error')}
    }catch(e){showMsg('msg','❌ '+e.message,'error')}
}

async function uploadImg(){
    var f=document.getElementById('f1').files[0];if(!f)return;
    var s=document.getElementById('st1');s.textContent='Uploading...';s.style.color='#C9A96E';
    var fd=new FormData();fd.append('file',f);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{
        var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});
        var d=await r.json();
        if(d.secure_url){document.getElementById('u1').value=d.secure_url;document.getElementById('pv1').src=d.secure_url;document.getElementById('pv1').style.display='block';s.textContent='✅';s.style.color='#27ae60'}
    }catch(e){s.textContent='❌'}
}

function getCats(){return Object.keys(menuData)}
function getAllItems(){var items=[];for(var k in menuData)menuData[k].forEach(function(item){items.push({...item,category:k})});return items}

function renderAll(){
    renderItems();
    var cats=getCats();
    var opts='<option value="">Select Category</option>';
    cats.forEach(function(c){opts+='<option value="'+esc(c)+'">'+c+'</option>'});
    document.getElementById('category').innerHTML=opts;
}

function renderItems(){
    var search=(document.getElementById('sp')?.value||'').toLowerCase();
    var items=getAllItems();
    if(search)items=items.filter(function(i){return i.name.toLowerCase().indexOf(search)!==-1});
    var c=document.getElementById('pList');
    if(!items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No items. Click "Load All Defaults" to populate.</p>';return}
    c.innerHTML=items.map(function(p){
        var img=p.image||'https://placehold.co/45/1A1A1A/C9A96E';
        if(img&&!img.startsWith('http'))img='https://raw.githubusercontent.com/developereth/Lantica/main/'+img;
        return'<div class="item-row"><img src="'+img+'" onerror="this.src=\'https://placehold.co/45/1A1A1A/C9A96E\'"><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.category)+' | '+p.price+' ETB</p></div><button class="btn-blue btn-sm" onclick="editItem(\''+esc(p.category)+'\',\''+p.id+'\')">✏️</button><button class="btn-red btn-sm" onclick="deleteItem(\''+esc(p.category)+'\',\''+p.id+'\')">🗑️</button></div>';
    }).join('');
}

function addItem(){
    var n=document.getElementById('name').value.trim();
    var pr=parseInt(document.getElementById('price').value)||0;
    var cat=document.getElementById('category').value;
    var img=document.getElementById('u1').value||document.getElementById('imageUrl').value.trim();
    if(!n||!pr||!cat){showMsg('msg','❌ Fill name, price, category','error');return}
    if(!menuData[cat])menuData[cat]=[];
    var maxId=0;for(var k in menuData)menuData[k].forEach(function(i){if(parseInt(i.id)>maxId)maxId=parseInt(i.id)});
    menuData[cat].push({id:String(maxId+1),name:n,price:pr,image:img});
    document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('imageUrl').value='';
    document.getElementById('u1').value='';document.getElementById('pv1').style.display='none';document.getElementById('st1').textContent='';document.getElementById('f1').value='';
    saveData();renderAll();showMsg('msg','✅ Added!','success');
}

function editItem(cat,id){
    var p=menuData[cat].find(function(x){return x.id==id});if(!p)return;
    var img=p.image||'';if(img&&!img.startsWith('http'))img='https://raw.githubusercontent.com/developereth/Lantica/main/'+img;
    var newName=prompt('Edit name:',p.name);if(!newName)return;
    var newPrice=prompt('Edit price:',p.price);if(!newPrice)return;
    p.name=newName;p.price=parseInt(newPrice)||0;
    saveData();renderAll();showMsg('msg','✅ Updated!','success');
}

function deleteItem(cat,id){
    if(!confirm('Delete?'))return;
    menuData[cat]=menuData[cat].filter(function(x){return x.id!=id});
    if(!menuData[cat].length)delete menuData[cat];
    saveData();renderAll();showMsg('msg','🗑️ Deleted','success');
}

function addCategory(){
    var n=document.getElementById('newCat').value.trim();
    if(!n)return;
    if(!menuData[n])menuData[n]=[];
    document.getElementById('newCat').value='';
    saveData();renderAll();showMsg('msg','✅ Category added!','success');
}

function showMsg(id,t,type){var m=document.getElementById(id);m.textContent=t;m.className='msg '+type;setTimeout(function(){m.className='msg'},3000)}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
