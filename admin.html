<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:900px;margin:0 auto}
        .login-box{background:#111;padding:40px;border-radius:15px;max-width:400px;margin:100px auto;text-align:center;border:1px solid #C9A96E}
        .login-box h2{color:#C9A96E;margin-bottom:20px}
        .login-box input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .hidden{display:none!important}
        h1{color:#C9A96E;margin-bottom:20px;font-size:1.5rem;text-align:center}
        .tabs{display:flex;gap:5px;margin-bottom:20px;justify-content:center}
        .tabs button{padding:10px 20px;border:1px solid #C9A96E;background:transparent;color:#C9A96E;border-radius:8px;cursor:pointer;font-weight:600}
        .tabs button.active,.tabs button:hover{background:#C9A96E;color:#000}
        .tab-content{display:none}.tab-content.show{display:block}
        .card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:12px;font-size:1.1rem}
        .row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:8px;font-family:inherit}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#C9A96E}
        button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#C9A96E;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:15px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px}
        .preview-row{margin-bottom:8px}.preview-row img{width:100px;height:100px;object-fit:cover;border-radius:8px;display:none}
        .msg{padding:10px;margin:8px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:12px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #333;flex-wrap:wrap}
        .item-row img{width:45px;height:45px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1;min-width:120px}.item-row .info h3{color:#C9A96E;font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .search-box{width:100%;padding:10px;background:#1a1a1a;border:2px solid #C9A96E;border-radius:20px;color:#fff;margin-bottom:12px}
        .edit-form{display:none;background:#1a1a1a;padding:15px;border-radius:8px;margin:8px 0;border:1px solid #C9A96E}.edit-form.show{display:block}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
        .btn-sm{padding:6px 14px;font-size:0.8rem}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
<div id="loginScreen" class="login-box"><h2>🔐 Lantica Admin</h2><input type="password" id="pw" placeholder="Enter Password" onkeypress="if(event.key==='Enter')login()"><button class="btn-gold" onclick="login()">Access Admin</button><p id="loginErr" style="color:#e74c3c;margin-top:10px;display:none">❌ Wrong password</p></div>

<div id="panel" class="hidden">
<div class="top-bar"><h1 style="margin:0">🍽️ Lantica 1960</h1><div style="display:flex;gap:8px"><button class="btn-green btn-sm" onclick="saveData()">💾 Save</button><button class="btn-red btn-sm" onclick="logout()">Logout</button></div></div>
<div class="tabs"><button class="active" onclick="switchTab('menu')">🍽️ Menu</button><button onclick="switchTab('heritage')">🏛️ Heritage</button></div>

<div class="tab-content show" id="tab-menu">
<div class="card"><h2>➕ Add Item</h2>
<div class="upload-box" onclick="document.getElementById('f1').click()">📷 Upload to Cloudinary</div>
<input type="file" id="f1" accept="image/*" style="display:none" onchange="addImg()">
<div class="preview-row"><img id="pv1"><span id="st1" style="font-size:0.7rem;margin-left:10px"></span></div>
<input type="hidden" id="u1">
<div class="row"><input type="text" id="name" placeholder="Item Name *"><input type="number" id="price" placeholder="Price (ETB) *"></div>
<div class="row"><select id="category"><option value="">Category</option></select><input type="text" id="imageUrl" placeholder="Or paste image URL"></div>
<div class="row"><input type="text" id="newCat" placeholder="New category"><button class="btn-gold btn-sm" onclick="addCategory()">+ Add</button></div>
<button class="btn-gold" onclick="addItem()">✅ Add Item</button><div id="msg" class="msg"></div>
</div>

<div class="edit-form" id="editForm"><h2>✏️ Edit</h2><input type="hidden" id="editId">
<div class="upload-box" onclick="document.getElementById('ef1').click()">📷 Change image</div>
<input type="file" id="ef1" accept="image/*" style="display:none" onchange="editImg()">
<div class="preview-row"><img id="ep1"><span id="es1" style="font-size:0.7rem;margin-left:10px"></span></div>
<input type="hidden" id="eu1">
<div class="row"><input type="text" id="en" placeholder="Name"><input type="number" id="epr" placeholder="Price"></div>
<div class="row"><select id="ec"><option value="">Category</option></select><input type="text" id="eurl" placeholder="Image URL"></div>
<button class="btn-green" onclick="saveEdit()">💾 Save</button><button class="btn-red" onclick="cancelEdit()">Cancel</button></div>

<div class="card"><h2>📋 Items</h2><input type="text" class="search-box" placeholder="🔍 Search..." id="sp" oninput="renderItems()"><div id="pList">Loading...</div></div>
</div>
</div></div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',menuData={items:[]},adminKey='';

// LOGIN - Test connection to API
async function login(){
    adminKey = document.getElementById('pw').value;
    // Test if password works
    var r = await fetch('https://lantica-menu.developeraddis.workers.dev/api/menu');
    if(r.ok){
        menuData = await r.json();
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        renderAll();
    } else {
        document.getElementById('loginErr').style.display='block';
    }
}

function logout(){
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    menuData = {items:[]};
}
function switchTab(t){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('show'));
    document.getElementById('tab-'+t).classList.add('show');
}

async function saveData(){
    try{
        var r = await fetch('https://lantica-menu.developeraddis.workers.dev/api/menu',{
            method:'POST',
            headers:{'Content-Type':'application/json','X-Admin-Key':adminKey},
            body:JSON.stringify(menuData)
        });
        if(r.ok){showMsg('msg','✅ Saved!','success')}
        else{showMsg('msg','❌ Save failed - check password','error')}
    }catch(e){showMsg('msg','❌ '+e.message,'error')}
}

async function cloudUpload(file,pvId,stId,uId){
    var s=document.getElementById(stId);s.textContent='Uploading...';s.style.color='#C9A96E';
    var fd=new FormData();fd.append('file',file);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});var d=await r.json();
    if(d.secure_url){document.getElementById(uId).value=d.secure_url;document.getElementById(pvId).src=d.secure_url;document.getElementById(pvId).style.display='block';s.textContent='✅';s.style.color='#27ae60'}else{s.textContent='❌';s.style.color='#e74c3c'}}catch(e){s.textContent='❌';s.style.color='#e74c3c'}
}
function addImg(){var f=document.getElementById('f1').files[0];if(f)cloudUpload(f,'pv1','st1','u1')}
function editImg(){var f=document.getElementById('ef1').files[0];if(f)cloudUpload(f,'ep1','es1','eu1')}

function getCats(){var c=[];menuData.items.forEach(i=>{if(!c.includes(i.category))c.push(i.category)});return c}
function renderAll(){renderItems();var s=document.getElementById('category');s.innerHTML='<option value="">Category</option>'+getCats().map(c=>'<option value="'+esc(c)+'">'+c+'</option>').join('');document.getElementById('ec').innerHTML='<option value="">Category</option>'+getCats().map(c=>'<option value="'+esc(c)+'">'+c+'</option>').join('')}
function renderItems(){
    var s=(document.getElementById('sp')?.value||'').toLowerCase();var items=menuData.items;
    if(s)items=items.filter(i=>i.name.toLowerCase().includes(s));
    var c=document.getElementById('pList');
    if(!items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:20px">No items</p>';return}
    c.innerHTML=items.map(p=>'<div class="item-row"><img src="'+(p.image?p.image.startsWith('http')?p.image:'https://raw.githubusercontent.com/developereth/Lantica/main/'+p.image:'https://placehold.co/45/1A1A1A/C9A96E')+'" onerror="this.src=\'https://placehold.co/45/1A1A1A/C9A96E\'"><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.category)+' | '+p.price+' ETB</p></div><button class="btn-blue btn-sm" onclick="editItem('+p.id+')">✏️</button><button class="btn-red btn-sm" onclick="deleteItem('+p.id+')">🗑️</button></div>').join('')}
function addItem(){var n=document.getElementById('name').value.trim(),pr=parseInt(document.getElementById('price').value)||0,cat=document.getElementById('category').value,img=document.getElementById('u1').value||document.getElementById('imageUrl').value.trim();if(!n||!pr||!cat){showMsg('msg','❌ Fill fields','error');return}var maxId=0;menuData.items.forEach(i=>{if(i.id>maxId)maxId=i.id});menuData.items.push({id:maxId+1,name:n,price:pr,category:cat,image:img});['name','price','imageUrl'].forEach(id=>document.getElementById(id).value='');document.getElementById('u1').value='';document.getElementById('pv1').style.display='none';document.getElementById('st1').textContent='';document.getElementById('f1').value='';saveData();renderAll();showMsg('msg','✅ Added!','success')}
function editItem(id){var p=menuData.items.find(x=>x.id==id);if(!p)return;document.getElementById('editId').value=p.id;document.getElementById('en').value=p.name;document.getElementById('epr').value=p.price;document.getElementById('ec').value=p.category;document.getElementById('eurl').value=p.image||'';document.getElementById('eu1').value=p.image||'';if(p.image){document.getElementById('ep1').src=p.image.startsWith('http')?p.image:'https://raw.githubusercontent.com/developereth/Lantica/main/'+p.image;document.getElementById('ep1').style.display='block'}else document.getElementById('ep1').style.display='none';document.getElementById('es1').textContent='';document.getElementById('ef1').value='';document.getElementById('editForm').classList.add('show');document.getElementById('editForm').scrollIntoView({behavior:'smooth'})}
function cancelEdit(){document.getElementById('editForm').classList.remove('show')}
function saveEdit(){var id=parseInt(document.getElementById('editId').value),n=document.getElementById('en').value.trim(),pr=parseInt(document.getElementById('epr').value)||0,cat=document.getElementById('ec').value,img=document.getElementById('eu1').value||document.getElementById('eurl').value.trim();var p=menuData.items.find(x=>x.id==id);if(!p)return;p.name=n;p.price=pr;p.category=cat;p.image=img;cancelEdit();saveData();renderAll();showMsg('msg','✅ Updated!','success')}
function deleteItem(id){if(!confirm('Delete?'))return;menuData.items=menuData.items.filter(x=>x.id!=id);saveData();renderAll();showMsg('msg','🗑️ Deleted','success')}
function addCategory(){var n=document.getElementById('newCat').value.trim();if(!n)return;document.getElementById('newCat').value='';renderAll();showMsg('msg','✅ Category ready!','success')}
function showMsg(id,t,type){var m=document.getElementById(id);m.textContent=t;m.className='msg '+type;setTimeout(()=>m.className='msg',3000)}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
