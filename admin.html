<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:900px;margin:0 auto}
        h1{color:#C9A96E;margin-bottom:20px;font-size:1.5rem;text-align:center}
        .card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:12px;font-size:1.1rem}
        .row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
        input,select{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:8px}
        button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#C9A96E;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:15px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px}
        .msg{padding:10px;margin:8px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:12px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #333;flex-wrap:wrap}
        .item-row img{width:45px;height:45px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1}.item-row .info h3{color:#C9A96E;font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .search-box{width:100%;padding:10px;background:#1a1a1a;border:2px solid #C9A96E;border-radius:20px;color:#fff;margin-bottom:12px}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
<div class="top-bar"><h1 style="margin:0">🍽️ Lantica 1960</h1><div style="display:flex;gap:8px"><button class="btn-green" onclick="saveData()">💾 Save</button><button class="btn-blue" onclick="loadData()">🔄 Reload</button></div></div>

<div class="card"><h2>➕ Add Item</h2>
<div class="upload-box" onclick="document.getElementById('f1').click()">📷 Upload Image</div>
<input type="file" id="f1" accept="image/*" style="display:none" onchange="uploadImg()">
<div style="margin-bottom:8px"><img id="pv1" style="width:100px;height:100px;object-fit:cover;border-radius:8px;display:none"><span id="st1" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="u1">
<div class="row"><input type="text" id="name" placeholder="Item Name *"><input type="number" id="price" placeholder="Price *"></div>
<div class="row"><select id="category"><option value="">Category</option></select><input type="text" id="imageUrl" placeholder="Or paste image URL"></div>
<div class="row"><input type="text" id="newCat" placeholder="New category"><button class="btn-gold" onclick="addCategory()">+ Add</button></div>
<button class="btn-gold" onclick="addItem()">✅ Add</button><div id="msg" class="msg"></div>
</div>

<div class="card"><h2>📋 Items</h2><input type="text" class="search-box" placeholder="🔍 Search..." id="sp" oninput="renderItems()"><div id="pList">Loading...</div></div>
</div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',API='https://lantica-menu.developeraddis.workers.dev/api/menu';
var menuData={};

loadData();

async function loadData(){
    try{var r=await fetch(API);var d=await r.json();menuData=d||{};renderAll()}catch(e){menuData={};renderAll()}
}
async function saveData(){
    try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(menuData)});var d=await r.json();if(d.success)showMsg('msg','✅ Saved!','success')}catch(e){showMsg('msg','❌ '+e.message,'error')}
}
async function uploadImg(){
    var f=document.getElementById('f1').files[0];if(!f)return;
    var s=document.getElementById('st1');s.textContent='Uploading...';
    var fd=new FormData();fd.append('file',f);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});var d=await r.json();
    if(d.secure_url){document.getElementById('u1').value=d.secure_url;document.getElementById('pv1').src=d.secure_url;document.getElementById('pv1').style.display='block';s.textContent='✅'}}catch(e){s.textContent='❌'}
}
function getCats(){return Object.keys(menuData)}
function getAllItems(){var items=[];for(var k in menuData)menuData[k].forEach(function(i){items.push({...i,category:k})});return items}
function renderAll(){renderItems();document.getElementById('category').innerHTML='<option value="">Category</option>'+getCats().map(c=>'<option value="'+esc(c)+'">'+c+'</option>').join('')}
function renderItems(){
    var s=(document.getElementById('sp')?.value||'').toLowerCase(),items=getAllItems();
    if(s)items=items.filter(i=>i.name.toLowerCase().includes(s));
    var c=document.getElementById('pList');
    if(!items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No items</p>';return}
    c.innerHTML=items.map(p=>'<div class="item-row"><img src="'+(p.image||'https://placehold.co/45/1A1A1A/C9A96E')+'" onerror="this.src=\'https://placehold.co/45/1A1A1A/C9A96E\'"><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.category)+' | '+p.price+' ETB</p></div><button class="btn-blue" onclick="editItem(\''+esc(p.category)+'\',\''+p.id+'\')">✏️</button><button class="btn-red" onclick="deleteItem(\''+esc(p.category)+'\',\''+p.id+'\')">🗑️</button></div>').join('')}
function addItem(){
    var n=document.getElementById('name').value.trim(),pr=parseInt(document.getElementById('price').value)||0,cat=document.getElementById('category').value,img=document.getElementById('u1').value||document.getElementById('imageUrl').value.trim();
    if(!n||!pr||!cat){showMsg('msg','❌ Fill all fields','error');return}
    if(!menuData[cat])menuData[cat]=[];
    var maxId=0;for(var k in menuData)menuData[k].forEach(i=>{if(parseInt(i.id)>maxId)maxId=parseInt(i.id)});
    menuData[cat].push({id:String(maxId+1),name:n,price:pr,image:img});
    document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('imageUrl').value='';document.getElementById('u1').value='';document.getElementById('pv1').style.display='none';document.getElementById('st1').textContent='';document.getElementById('f1').value='';
    saveData();renderAll();showMsg('msg','✅ Added!','success')}
function editItem(cat,id){var p=menuData[cat].find(x=>x.id==id);if(!p)return;var nn=prompt('Name:',p.name);if(!nn)return;var np=prompt('Price:',p.price);if(!np)return;p.name=nn;p.price=parseInt(np)||0;saveData();renderAll();showMsg('msg','✅ Updated!','success')}
function deleteItem(cat,id){if(!confirm('Delete?'))return;menuData[cat]=menuData[cat].filter(x=>x.id!=id);if(!menuData[cat].length)delete menuData[cat];saveData();renderAll();showMsg('msg','🗑️ Deleted','success')}
function addCategory(){var n=document.getElementById('newCat').value.trim();if(!n)return;if(!menuData[n])menuData[n]=[];document.getElementById('newCat').value='';saveData();renderAll();showMsg('msg','✅ Added!','success')}
function showMsg(id,t,type){var m=document.getElementById(id);m.textContent=t;m.className='msg '+type;setTimeout(()=>m.className='msg',3000)}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
