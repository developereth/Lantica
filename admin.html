<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantica 1960 | Complete Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #E8E0D5;
            padding: 20px;
        }
        :root {
            --gold: #C9A96E;
            --gold-dark: #B8933F;
            --red: #B45F3B;
            --green: #2E7D32;
            --dark-card: #1A1A1A;
            --gray: #9B8A74;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
            border-bottom: 2px solid var(--gold);
            padding: 20px 25px;
            border-radius: 20px 20px 0 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; }
        .header p { font-size: 0.7rem; color: var(--gray); }
        
        /* Cards */
        .card {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #2C2823;
        }
        .login-card { max-width: 400px; margin: 100px auto; text-align: center; }
        
        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--gray); }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0D0D0D;
            border: 1px solid #2C2823;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        
        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-gold { background: var(--gold); color: #0A0A0A; }
        .btn-gold:hover { background: var(--gold-dark); transform: scale(1.02); }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: var(--green); color: white; }
        
        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #0D0D0D; color: var(--gold); }
        td { padding: 10px 12px; border-top: 1px solid #2C2823; }
        .edit-btn, .delete-btn { padding: 6px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; border: none; margin: 0 3px; }
        .edit-btn { background: var(--gold); color: #0A0A0A; }
        .delete-btn { background: var(--red); color: white; }
        
        /* Image preview */
        .img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; background: #0D0D0D; }
        .img-preview-large { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #0D0D0D; padding: 15px; border-radius: 16px; text-align: center; }
        .stat-card h3 { font-size: 1.8rem; color: var(--gold); }
        
        /* Search & Filter */
        .search-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .search-input { flex: 2; padding: 12px; background: var(--dark-card); border: 1px solid #2C2823; border-radius: 40px; color: white; }
        .filter-select { flex: 1; padding: 12px; background: var(--dark-card); border: 1px solid #2C2823; border-radius: 40px; color: white; }
        
        /* Status */
        .status { background: rgba(46,125,50,0.2); color: #4CAF50; padding: 10px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .status-error { background: rgba(180,95,59,0.2); color: var(--red); }
        
        .hidden { display: none; }
        
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN SECTION -->
    <div id="loginSection" class="login-card card">
        <h2 style="color: var(--gold); margin-bottom: 20px;">Lantica 1960 Admin</h2>
        <input type="password" id="adminPassword" placeholder="Password">
        <button class="btn btn-gold" onclick="login()" style="width:100%;">Login</button>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminSection" class="hidden">
        <div class="header">
            <div>
                <h1><i class="fas fa-crown"></i> Lantica 1960 Admin Dashboard</h1>
                <p>Manage menu items - changes appear immediately for all customers</p>
            </div>
            <div>
                <button class="btn btn-green" onclick="refreshCache()"><i class="fas fa-sync-alt"></i> Refresh Cache</button>
                <button class="btn btn-red" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-utensils"></i><h3 id="totalItems">0</h3><p>Total Items</p></div>
            <div class="stat-card"><i class="fas fa-tags"></i><h3 id="totalCategories">0</h3><p>Categories</p></div>
            <div class="stat-card"><i class="fas fa-dollar-sign"></i><h3 id="avgPrice">0</h3><p>Avg Price (ETB)</p></div>
        </div>

        <!-- Status -->
        <div id="statusMsg" class="status">Connected - Menu is LIVE</div>

        <!-- Add/Edit Form -->
        <div class="card">
            <h3 style="color: var(--gold); margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> <span id="formTitle">Add New Menu Item</span></h3>
            <div class="form-row">
                <div class="form-group"><label>Item Name *</label><input type="text" id="itemName" placeholder="e.g., Lamb Tibs"></div>
                <div class="form-group"><label>Price (ETB) *</label><input type="number" id="itemPrice" placeholder="e.g., 680"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Category *</label>
                    <select id="itemCategory">
                        <option>Breakfast</option><option>Signatures</option><option>Pizza</option>
                        <option>Pasta</option><option>Burgers</option><option>Pork</option>
                        <option>Soups</option><option>Fast Food</option><option>Juices</option>
                        <option>Cold Drinks</option><option>Beer</option><option>Wine</option>
                        <option>Hot Beverages</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <input type="text" id="itemImage" placeholder="Image URL or upload new" style="flex: 2;">
                        <button type="button" class="btn btn-gold" onclick="openUploadWidget()" style="margin:0;"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
                    </div>
                    <div id="imagePreview" style="margin-top: 8px;"></div>
                </div>
            </div>
            <div class="form-group"><label>Description</label><textarea id="itemDesc" rows="2" placeholder="Brief description of the dish"></textarea></div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-gold" onclick="saveItem()"><i class="fas fa-save"></i> Save Item</button>
                <button id="cancelBtn" class="btn btn-red" onclick="cancelEdit()" style="display: none;"><i class="fas fa-times"></i> Cancel Edit</button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search menu items...">
            <select id="categoryFilter" class="filter-select">
                <option value="all">All Categories</option>
                <option>Breakfast</option><option>Signatures</option><option>Pizza</option>
                <option>Pasta</option><option>Burgers</option><option>Pork</option>
                <option>Soups</option><option>Fast Food</option><option>Juices</option>
                <option>Cold Drinks</option><option>Beer</option><option>Wine</option>
                <option>Hot Beverages</option>
            </select>
            <button class="btn btn-gold" onclick="loadMenu()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn btn-red" onclick="confirmReset()"><i class="fas fa-undo"></i> Reset All</button>
        </div>

        <!-- Menu Items Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-container">
                <table id="menuTable">
                    <thead>
                        <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Description</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="menuTableBody"><tr><td colspan="6" style="text-align:center; padding:40px;">Loading menu items...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const WORKER_URL = "https://lanticaadminpage.developeraddis.workers.dev";
    const ADMIN_PASSWORD = "lantica1960admin";
    const GITHUB_RAW = "https://raw.githubusercontent.com/developereth/Lantica/main/";
    const CLOUDINARY_CLOUD_NAME = "dwqgdpcnr";
    const CLOUDINARY_UPLOAD_PRESET = "lantica_menu";
    
    let menuItems = [];
    let editId = null;
    let currentImageUrl = "";

    // ========== AUTHENTICATION ==========
    function login() {
        const pwd = document.getElementById("adminPassword").value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("adminSection").classList.remove("hidden");
            loadMenu();
        } else {
            alert("Wrong password!");
        }
    }
    
    function logout() {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminSection").classList.add("hidden");
        document.getElementById("adminPassword").value = "";
    }

    // ========== CLOUDINARY UPLOAD WIDGET ==========
    function openUploadWidget() {
        const widget = cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME,
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'camera', 'url'],
            multiple: false,
            cropping: true,
            croppingAspectRatio: 1.2,
            showUploadMoreButton: false,
            clientAllowedFormats: ['images'],
            maxImageFileSize: 5000000, // 5MB
            styles: { palette: { window: "#1A1A1A", button: "#C9A96E", text: "#FFFFFF" } }
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                const imageUrl = result.info.secure_url;
                document.getElementById("itemImage").value = imageUrl;
                currentImageUrl = imageUrl;
                document.getElementById("imagePreview").innerHTML = `<img src="${imageUrl}" class="img-preview-large" onerror="this.style.display='none'"> <span style="font-size:0.7rem; color:var(--gold);">✓ Uploaded!</span>`;
            }
        });
        widget.open();
    }

    // ========== MENU CRUD OPERATIONS ==========
    async function loadMenu() {
        try {
            const res = await fetch(`${WORKER_URL}/api/menu`);
            const data = await res.json();
            menuItems = data.items || [];
            renderTable();
            updateStats();
            const cacheStatus = res.headers.get('X-Cache') || 'MISS';
            document.getElementById("statusMsg").innerHTML = `✅ Loaded ${menuItems.length} items | Cache: ${cacheStatus}`;
            document.getElementById("statusMsg").className = "status";
        } catch(e) {
            document.getElementById("statusMsg").innerHTML = "❌ Error loading menu";
            document.getElementById("statusMsg").className = "status status-error";
        }
    }
    
    async function saveToWorker() {
        const res = await fetch(`${WORKER_URL}/api/menu`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_PASSWORD },
            body: JSON.stringify({ items: menuItems })
        });
        return res.ok;
    }
    
    async function refreshCache() {
        document.getElementById("statusMsg").innerHTML = "🔄 Refreshing cache...";
        await saveToWorker();
        await loadMenu();
    }
    
    async function saveItem() {
        const name = document.getElementById("itemName").value.trim();
        const price = parseFloat(document.getElementById("itemPrice").value);
        const category = document.getElementById("itemCategory").value;
        const image = document.getElementById("itemImage").value.trim();
        const description = document.getElementById("itemDesc").value.trim();
        
        if (!name || isNaN(price)) {
            alert("Please enter item name and price");
            return;
        }
        
        if (editId) {
            const index = menuItems.findIndex(i => i.id === editId);
            if (index !== -1) {
                menuItems[index] = { ...menuItems[index], name, price, category, image, description };
            }
            editId = null;
            document.getElementById("formTitle").innerHTML = "Add New Menu Item";
            document.getElementById("cancelBtn").style.display = "none";
        } else {
            const newId = Math.max(...menuItems.map(i => i.id), 0) + 1;
            menuItems.push({ id: newId, name, price, category, image, description });
        }
        
        if (await saveToWorker()) {
            document.getElementById("statusMsg").innerHTML = "✅ Saved! Menu updated for all customers";
            document.getElementById("itemName").value = "";
            document.getElementById("itemPrice").value = "";
            document.getElementById("itemImage").value = "";
            document.getElementById("itemDesc").value = "";
            document.getElementById("imagePreview").innerHTML = "";
            await loadMenu();
        } else {
            document.getElementById("statusMsg").innerHTML = "❌ Save failed";
        }
    }
    
    function editItem(id) {
        const item = menuItems.find(i => i.id === id);
        if (!item) return;
        editId = id;
        document.getElementById("itemName").value = item.name;
        document.getElementById("itemPrice").value = item.price;
        document.getElementById("itemCategory").value = item.category;
        document.getElementById("itemImage").value = item.image || "";
        document.getElementById("itemDesc").value = item.description || "";
        if (item.image) {
            document.getElementById("imagePreview").innerHTML = `<img src="${item.image}" class="img-preview-large" onerror="this.style.display='none'">`;
        }
        document.getElementById("formTitle").innerHTML = "✏️ Edit Menu Item";
        document.getElementById("cancelBtn").style.display = "inline-block";
    }
    
    async function deleteItem(id) {
        if (confirm("Delete this item? All customers will see the change immediately.")) {
            menuItems = menuItems.filter(i => i.id !== id);
            if (await saveToWorker()) {
                await loadMenu();
                if (editId === id) cancelEdit();
            }
        }
    }
    
    function cancelEdit() {
        editId = null;
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemImage").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("imagePreview").innerHTML = "";
        document.getElementById("formTitle").innerHTML = "Add New Menu Item";
        document.getElementById("cancelBtn").style.display = "none";
    }
    
    async function confirmReset() {
        if (confirm("⚠️ WARNING: This will reset ALL menu items to default. This cannot be undone. Continue?")) {
            await resetToDefault();
        }
    }
    
    async function resetToDefault() {
        // Your default menu items here (keeping your existing data)
        menuItems = [
            { id: 1, name: "Combo Fasting", price: 250, category: "Breakfast", image: "combo-fasting-platter.jpg", description: "" },
            { id: 2, name: "Egg w/ meat", price: 250, category: "Breakfast", image: "egg-with-minced-meat.jpg", description: "" },
            { id: 3, name: "Lamb Tibs", price: 680, category: "Signatures", image: "lamb-tibs.jpg", description: "" },
            // ... add all your other default items here
        ];
        if (await saveToWorker()) {
            await loadMenu();
            cancelEdit();
            document.getElementById("statusMsg").innerHTML = "✅ Reset to default menu";
        }
    }
    
    // ========== UI RENDERING ==========
    function updateStats() {
        document.getElementById("totalItems").innerText = menuItems.length;
        const categories = [...new Set(menuItems.map(i => i.category))];
        document.getElementById("totalCategories").innerText = categories.length;
        const avg = menuItems.reduce((sum, i) => sum + i.price, 0) / menuItems.length;
        document.getElementById("avgPrice").innerText = Math.round(avg);
    }
    
    function renderTable() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const filter = document.getElementById("categoryFilter").value;
        
        let filtered = menuItems.filter(item => {
            const matchSearch = item.name.toLowerCase().includes(search);
            const matchCategory = filter === "all" || item.category === filter;
            return matchSearch && matchCategory;
        });
        
        const tbody = document.getElementById("menuTableBody");
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">No items found. Add one above!</td></tr>';
            return;
        }
        
        let html = "";
        filtered.forEach(item => {
            let imgUrl = item.image || "";
            if (imgUrl && !imgUrl.startsWith('http')) {
                imgUrl = GITHUB_RAW + imgUrl;
            }
            const imgHtml = imgUrl ? `<img src="${imgUrl}" class="img-preview" onerror="this.src='https://placehold.co/40x40/1A1A1A/C9A96E'">` : "—";
            html += `<tr>
                <td>${imgHtml}</td>
                <td><strong>${escapeHtml(item.name)}</strong></td>
                <td><span style="background:rgba(201,169,110,0.2); padding:4px 8px; border-radius:20px; font-size:0.7rem;">${item.category}</span></td>
                <td style="color:var(--gold); font-weight:700;">${item.price} ETB</td>
                <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(item.description || '—')}</td>
                <td>
                    <button class="edit-btn" onclick="editItem(${item.id})"><i class="fas fa-edit"></i> Edit</button>
                    <button class="delete-btn" onclick="deleteItem(${item.id})"><i class="fas fa-trash"></i> Del</button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    // Event listeners
    document.getElementById("searchInput")?.addEventListener("keyup", () => renderTable());
    document.getElementById("categoryFilter")?.addEventListener("change", () => renderTable());
    
    // Auto-refresh preview when image URL changes
    document.getElementById("itemImage")?.addEventListener("input", (e) => {
        const url = e.target.value;
        if (url) {
            document.getElementById("imagePreview").innerHTML = `<img src="${url}" class="img-preview-large" onerror="this.style.display='none'">`;
        } else {
            document.getElementById("imagePreview").innerHTML = "";
        }
    });
</script>
</body>
</html>
