<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantica 1960 | Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0A0A0A; color: #E8E0D5; padding: 20px; }
        .card { background: #1A1A1A; border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 1px solid #C9A96E; max-width: 1200px; margin: 20px auto; }
        .login-card { max-width: 400px; margin: 100px auto; text-align: center; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #0D0D0D; border: 1px solid #2C2823; border-radius: 10px; color: white; }
        button { background: #C9A96E; color: #0A0A0A; padding: 12px 24px; border-radius: 40px; border: none; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-red { background: #B45F3B; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #0D0D0D; color: #C9A96E; }
        td { padding: 10px 12px; border-top: 1px solid #2C2823; }
        .edit-btn, .delete-btn { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; margin: 0 3px; }
        .edit-btn { background: #C9A96E; color: #0A0A0A; }
        .delete-btn { background: #B45F3B; color: white; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-row > * { flex: 1; }
        .status { background: rgba(46,125,50,0.2); color: #4CAF50; padding: 10px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .hidden { display: none; }
        @media (max-width: 700px) { .form-row { flex-direction: column; } }
    </style>
</head>
<body>

<div id="loginSection" class="login-card card">
    <h2 style="color: #C9A96E;">Lantica 1960 Admin</h2>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button onclick="login()">Login</button>
</div>

<div id="adminSection" class="hidden">
    <div class="card">
        <div style="display: flex; justify-content: space-between;">
            <h2 style="color: #C9A96E;">🍽️ Menu Manager</h2>
            <button class="btn-red" onclick="logout()">Logout</button>
        </div>
        <div id="statusMsg" class="status">Ready</div>
        
        <h3>➕ Add Item</h3>
        <div class="form-row">
            <input type="text" id="itemName" placeholder="Name">
            <input type="number" id="itemPrice" placeholder="Price">
        </div>
        <div class="form-row">
            <select id="itemCategory">
                <option>Breakfast</option><option>Signatures</option><option>Pizza</option>
                <option>Pasta</option><option>Burgers</option><option>Juices</option>
                <option>Cold Drinks</option><option>Hot Beverages</option>
            </select>
            <input type="text" id="itemImage" placeholder="Cloudinary Image URL">
        </div>
        <textarea id="itemDesc" rows="2" placeholder="Description"></textarea>
        <button onclick="saveItem()">💾 Save Item</button>
        <button id="cancelBtn" class="btn-red" onclick="cancelEdit()" style="display:none">Cancel</button>
    </div>
    
    <div class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="searchInput" placeholder="Search..." style="flex:2">
            <select id="categoryFilter" style="flex:1">
                <option value="all">All Categories</option>
                <option>Breakfast</option><option>Signatures</option><option>Pizza</option>
                <option>Juices</option><option>Hot Beverages</option>
            </select>
            <button onclick="loadMenu()">🔄 Refresh</button>
            <button class="btn-red" onclick="resetToDefault()">Reset Default</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="menuTable">
                <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead>
                <tbody id="menuTableBody"><tr><td colspan="5">Loading...</td></tr</tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ========== GITHUB CONFIGURATION ==========
    const GITHUB_TOKEN = "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";
    const GITHUB_REPO = "developereth/Lantica";
    const ADMIN_PASSWORD = "lantica1960admin";
    
    let menuItems = [];
    let editId = null;
    
    function login() {
        const pwd = document.getElementById("adminPassword").value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("adminSection").classList.remove("hidden");
            loadMenu();
        } else {
            alert("Wrong password!");
        }
    }
    
    function logout() {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminSection").classList.add("hidden");
        document.getElementById("adminPassword").value = "";
    }
    
    async function loadMenu() {
        try {
            const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/menu.json`;
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            
            if (res.status === 404) {
                await createDefaultMenu();
                return loadMenu();
            }
            
            const data = await res.json();
            const content = JSON.parse(atob(data.content));
            menuItems = content.items || [];
            renderTable();
            document.getElementById("statusMsg").innerHTML = "✅ Menu loaded successfully";
        } catch(e) {
            document.getElementById("statusMsg").innerHTML = "❌ Error loading menu";
        }
    }
    
    async function saveToGitHub() {
        const menuData = { items: menuItems };
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuData, null, 2))));
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/menu.json`;
        
        let sha = null;
        const getRes = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }
        
        const res = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: "Menu update",
                content: content,
                sha: sha,
                branch: "main"
            })
        });
        
        if (res.ok) {
            document.getElementById("statusMsg").innerHTML = "✅ Saved! Menu updated";
            return true;
        }
        return false;
    }
    
    async function createDefaultMenu() {
        const defaultMenu = {
            items: [
                { id: 1, name: "Lamb Tibs", price: 680, category: "Signatures", image: "https://res.cloudinary.com/dwqgdpcnr/image/upload/v1/photo_5794060648273612539_y_1_l4nywy.jpg", description: "Tender lamb sautéed with berbere" },
                { id: 2, name: "Combo Fasting Platter", price: 250, category: "Breakfast", image: "", description: "Hearty vegan platter" },
                { id: 3, name: "Papaya Juice", price: 160, category: "Juices", image: "", description: "Freshly squeezed papaya" }
            ]
        };
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(defaultMenu, null, 2))));
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/menu.json`;
        
        await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Create default menu", content: content, branch: "main" })
        });
    }
    
    async function saveItem() {
        const name = document.getElementById("itemName").value.trim();
        const price = parseFloat(document.getElementById("itemPrice").value);
        const category = document.getElementById("itemCategory").value;
        const image = document.getElementById("itemImage").value.trim();
        const description = document.getElementById("itemDesc").value.trim();
        
        if (!name || isNaN(price)) {
            alert("Please enter name and price");
            return;
        }
        
        if (editId) {
            const index = menuItems.findIndex(i => i.id === editId);
            if (index !== -1) {
                menuItems[index] = { ...menuItems[index], name, price, category, image, description };
            }
            editId = null;
            document.getElementById("cancelBtn").style.display = "none";
        } else {
            const newId = Math.max(...menuItems.map(i => i.id), 0) + 1;
            menuItems.push({ id: newId, name, price, category, image, description });
        }
        
        if (await saveToGitHub()) {
            document.getElementById("itemName").value = "";
            document.getElementById("itemPrice").value = "";
            document.getElementById("itemImage").value = "";
            document.getElementById("itemDesc").value = "";
            loadMenu();
        }
    }
    
    function editItem(id) {
        const item = menuItems.find(i => i.id === id);
        if (!item) return;
        editId = id;
        document.getElementById("itemName").value = item.name;
        document.getElementById("itemPrice").value = item.price;
        document.getElementById("itemCategory").value = item.category;
        document.getElementById("itemImage").value = item.image || "";
        document.getElementById("itemDesc").value = item.description || "";
        document.getElementById("cancelBtn").style.display = "inline-block";
    }
    
    async function deleteItem(id) {
        if (confirm("Delete this item?")) {
            menuItems = menuItems.filter(i => i.id !== id);
            if (await saveToGitHub()) {
                loadMenu();
                if (editId === id) cancelEdit();
            }
        }
    }
    
    function cancelEdit() {
        editId = null;
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemImage").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("cancelBtn").style.display = "none";
    }
    
    async function resetToDefault() {
        if (confirm("Reset to default menu? All changes will be lost!")) {
            await createDefaultMenu();
            loadMenu();
        }
    }
    
    function renderTable() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const filter = document.getElementById("categoryFilter").value;
        
        let filtered = menuItems.filter(item => {
            const matchSearch = item.name.toLowerCase().includes(search);
            const matchCategory = filter === "all" || item.category === filter;
            return matchSearch && matchCategory;
        });
        
        const tbody = document.getElementById("menuTableBody");
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No items found</td></tr';
            return;
        }
        
        let html = "";
        filtered.forEach(item => {
            const imgPreview = item.image ? 
                `<img src="${item.image}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;" onerror="this.src='https://placehold.co/40x40/1A1A1A/C9A96E'">` : 
                "—";
            html += `
                <tr>
                    <td>${imgPreview}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${item.category}</td>
                    <td style="color:#C9A96E;">${item.price} ETB</td>
                    <td>
                        <button class="edit-btn" onclick="editItem(${item.id})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️ Delete</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    document.getElementById("searchInput")?.addEventListener("keyup", () => renderTable());
    document.getElementById("categoryFilter")?.addEventListener("change", () => renderTable());
</script>
</body>
</html>
