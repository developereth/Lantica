<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960 Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E8E0D5;padding:20px}
        :root{--gold:#C9A96E;--dark-card:#1A1A1A;--border:#2C2823}
        .container{max-width:1200px;margin:0 auto}
        h1{color:var(--gold);margin-bottom:20px;text-align:center;font-family:'Playfair Display',serif;font-size:2rem}
        .card{background:var(--dark-card);padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid var(--border)}
        h2{color:var(--gold);margin-bottom:15px;font-size:1.2rem}
        .row{display:flex;gap:12px;margin-bottom:12px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#0A0A0A;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px;font-family:inherit}
        input:focus,select:focus{outline:none;border-color:var(--gold)}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.9rem;transition:0.3s}
        .btn-gold{background:var(--gold);color:#0A0A0A}.btn-gold:hover{background:#B8933F}
        .btn-red{background:#c0392b;color:#fff}.btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff;padding:8px 16px;font-size:0.8rem}
        .btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed var(--gold);padding:20px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:0.3s}
        .upload-box:hover{background:#0A0A0A}
        .preview-row{margin-bottom:12px}
        .preview-row img{width:150px;height:100px;object-fit:cover;border-radius:8px;display:none}
        .status-row{margin-bottom:12px;font-size:0.75rem;color:var(--gold)}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:12px;padding:12px;background:#0A0A0A;border-radius:8px;margin-bottom:8px;border:1px solid var(--border)}
        .item-row:hover{background:#111}
        .item-row img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1}.item-row .info h3{color:var(--gold);font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .search-box{width:100%;padding:12px;background:#0A0A0A;border:2px solid var(--gold);border-radius:25px;color:#fff;margin-bottom:15px}
        .edit-form{display:none;background:#0A0A0A;padding:20px;border-radius:8px;margin:10px 0;border:1px solid var(--gold)}
        .edit-form.show{display:block}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
        .stat{background:var(--dark-card);padding:15px;border-radius:8px;text-align:center;border:1px solid var(--border)}
        .stat .num{font-size:1.5rem;font-weight:700;color:var(--gold)}.stat .lbl{font-size:0.7rem;color:#888;margin-top:3px}
        .export-btn{background:#8e44ad;color:#fff;padding:8px 16px;font-size:0.8rem;margin-left:10px}
        @media(max-width:768px){.row{flex-direction:column}.stats{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
<h1>🍽️ Lantica 1960 - Menu Admin</h1>

<div class="stats">
    <div class="stat"><div class="num" id="statCats">0</div><div class="lbl">Categories</div></div>
    <div class="stat"><div class="num" id="statItems">0</div><div class="lbl">Total Items</div></div>
    <div class="stat"><div class="num" id="statImg">0</div><div class="lbl">With Images</div></div>
</div>

<!-- ADD ITEM -->
<div class="card">
    <h2>➕ Add New Item</h2>
    <div class="upload-box" onclick="document.getElementById('f1').click()">
        <div style="font-size:28px">📷</div>
        <div style="font-size:0.7rem;color:#888">Upload Image (optional)</div>
    </div>
    <input type="file" id="f1" accept="image/*" style="display:none" onchange="addImg()">
    <div class="preview-row"><img id="pv1"></div>
    <div class="status-row" id="st1"></div>
    <input type="hidden" id="u1">
    
    <div class="row">
        <input type="text" id="iname" placeholder="Item Name *">
        <input type="number" id="iprice" placeholder="Price (ETB) *">
    </div>
    <div class="row">
        <select id="icategory">
            <option value="">Select Category</option>
        </select>
        <input type="text" id="inewcat" placeholder="Or type new category">
    </div>
    <button class="btn-gold" onclick="addItem()">✅ Add Item</button>
    <div id="msg" class="msg"></div>
</div>

<!-- EDIT FORM -->
<div class="edit-form" id="editForm">
    <h2>✏️ Edit Item</h2>
    <input type="hidden" id="editId">
    <input type="hidden" id="editOldCat">
    
    <div class="upload-box" onclick="document.getElementById('ef1').click()">
        <div style="font-size:28px">📷</div>
        <div style="font-size:0.7rem;color:#888">Change Image</div>
    </div>
    <input type="file" id="ef1" accept="image/*" style="display:none" onchange="editImg()">
    <div class="preview-row"><img id="ep1"></div>
    <div class="status-row" id="es1"></div>
    <input type="hidden" id="eu1">
    
    <div class="row">
        <input type="text" id="ename" placeholder="Name *">
        <input type="number" id="eprice" placeholder="Price *">
    </div>
    <div class="row">
        <select id="ecategory"></select>
        <input type="text" id="enewcat" placeholder="Or new category">
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn-green" onclick="saveEdit()">💾 Save Changes</button>
        <button class="btn-red" onclick="cancelEdit()">Cancel</button>
    </div>
</div>

<!-- ITEMS LIST -->
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <h2 style="margin:0">📋 Menu Items</h2>
        <div>
            <button class="btn-blue" onclick="exportData()" style="margin-right:5px">📥 Export</button>
            <button class="btn-blue" onclick="document.getElementById('importFile').click()">📤 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>
    <input type="text" class="search-box" placeholder="🔍 Search items..." id="sp" oninput="renderItems()">
    <div id="pList">Loading...</div>
</div>
</div>

// Load data
function loadMenu() {
    if (USE_API) {
        // Try API first
        fetch(API_URL + '/menu')
            .then(r => r.json())
            .then(d => {
                if (d.menu && Object.keys(d.menu).length > 0) {
                    menuData = d.menu;
                } else {
                    loadLocal();
                }
                afterLoad();
            })
            .catch(() => {
                loadLocal();
                afterLoad();
            });
    } else {
        loadLocal();
        afterLoad();
    }
}

function loadLocal() {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            menuData = JSON.parse(saved);
            if (Object.keys(menuData).length === 0) {
                menuData = JSON.parse(JSON.stringify(DEFAULT_MENU));
                saveLocal();
            }
        } catch (e) {
            menuData = JSON.parse(JSON.stringify(DEFAULT_MENU));
            saveLocal();
        }
    } else {
        menuData = JSON.parse(JSON.stringify(DEFAULT_MENU));
        saveLocal();
    }
}

function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(menuData));
}

function saveToAPI() {
    if (!USE_API) return;
    // Optional: sync to API
    fetch(API_URL + '/menu/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ menu: menuData })
    }).catch(e => console.log('API sync failed'));
}

function afterLoad() {
    updateStats();
    renderItems();
    updateCategorySelects();
}

// Category management
function getCategories() {
    return Object.keys(menuData);
}

function updateCategorySelects() {
    var cats = getCategories();
    var options = cats.map(c => '<option value="' + c + '">' + c + '</option>').join('');
    
    // Add form
    var addSelect = document.getElementById('icategory');
    addSelect.innerHTML = '<option value="">Select Category</option>' + options;
    
    // Edit form
    var editSelect = document.getElementById('ecategory');
    editSelect.innerHTML = options;
}

function updateStats() {
    var cats = getCategories();
    var total = 0, withImg = 0;
    
    cats.forEach(cat => {
        total += menuData[cat].length;
        menuData[cat].forEach(item => {
            if (item.image && item.image !== '') withImg++;
        });
    });
    
    document.getElementById('statCats').textContent = cats.length;
    document.getElementById('statItems').textContent = total;
    document.getElementById('statImg').textContent = withImg;
}

// Image upload
async function cloudUpload(file, pvId, stId, uId) {
    var s = document.getElementById(stId);
    s.textContent = 'Uploading...';
    var fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    
    try {
        var r = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
            method: 'POST',
            body: fd
        });
        var d = await r.json();
        if (d.secure_url) {
            document.getElementById(uId).value = d.secure_url;
            document.getElementById(pvId).src = d.secure_url;
            document.getElementById(pvId).style.display = 'block';
            s.textContent = '✅ Image uploaded!';
        } else {
            s.textContent = '❌ Upload failed';
        }
    } catch (e) {
        s.textContent = '❌ Error uploading';
    }
}

function addImg() {
    var f = document.getElementById('f1').files[0];
    if (f) cloudUpload(f, 'pv1', 'st1', 'u1');
}

function editImg() {
    var f = document.getElementById('ef1').files[0];
    if (f) cloudUpload(f, 'ep1', 'es1', 'eu1');
}

// Add item
function addItem() {
    var name = document.getElementById('iname').value.trim();
    var price = document.getElementById('iprice').value.trim();
    var category = document.getElementById('icategory').value;
    var newCat = document.getElementById('inewcat').value.trim();
    var image = document.getElementById('u1').value;
    
    if (!name || !price) {
        showMsg('msg', '❌ Fill name and price', 'error');
        return;
    }
    if (!category && !newCat) {
        showMsg('msg', '❌ Select or enter category', 'error');
        return;
    }
    
    var finalCat = newCat || category;
    
    if (!menuData[finalCat]) {
        menuData[finalCat] = [];
    }
    
    var newItem = {
        id: Date.now().toString(),
        name: name,
        price: parseInt(price),
        image: image
    };
    
    menuData[finalCat].push(newItem);
    saveLocal();
    saveToAPI();
    
    // Clear form
    document.getElementById('iname').value = '';
    document.getElementById('iprice').value = '';
    document.getElementById('icategory').value = '';
    document.getElementById('inewcat').value = '';
    document.getElementById('u1').value = '';
    document.getElementById('pv1').style.display = 'none';
    document.getElementById('st1').textContent = '';
    document.getElementById('f1').value = '';
    
    showMsg('msg', '✅ Item added successfully!', 'success');
    updateStats();
    renderItems();
    updateCategorySelects();
}

// Edit item
function editItem(id) {
    var item = null, catName = '';
    for (var cat in menuData) {
        var found = menuData[cat].find(i => i.id === id);
        if (found) {
            item = found;
            catName = cat;
            break;
        }
    }
    if (!item) return;
    
    document.getElementById('editId').value = item.id;
    document.getElementById('editOldCat').value = catName;
    document.getElementById('ename').value = item.name;
    document.getElementById('eprice').value = item.price;
    document.getElementById('ecategory').value = catName;
    document.getElementById('enewcat').value = '';
    document.getElementById('eu1').value = item.image || '';
    
    if (item.image) {
        document.getElementById('ep1').src = item.image;
        document.getElementById('ep1').style.display = 'block';
    } else {
        document.getElementById('ep1').style.display = 'none';
    }
    
    document.getElementById('es1').textContent = '';
    document.getElementById('ef1').value = '';
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
}

function cancelEdit() {
    document.getElementById('editForm').classList.remove('show');
}

function saveEdit() {
    var id = document.getElementById('editId').value;
    var oldCat = document.getElementById('editOldCat').value;
    var name = document.getElementById('ename').value.trim();
    var price = document.getElementById('eprice').value.trim();
    var category = document.getElementById('ecategory').value;
    var newCat = document.getElementById('enewcat').value.trim();
    var image = document.getElementById('eu1').value;
    
    if (!name || !price) {
        alert('Fill all required fields');
        return;
    }
    
    var finalCat = newCat || category;
    
    // Remove from old category
    var index = menuData[oldCat].findIndex(i => i.id === id);
    if (index !== -1) {
        var item = menuData[oldCat].splice(index, 1)[0];
        
        // Update item
        item.name = name;
        item.price = parseInt(price);
        item.image = image;
        
        // Add to new category
        if (!menuData[finalCat]) {
            menuData[finalCat] = [];
        }
        menuData[finalCat].push(item);
        
        // Clean empty category
        if (menuData[oldCat].length === 0) {
            delete menuData[oldCat];
        }
    }
    
    saveLocal();
    saveToAPI();
    
    showMsg('msg', '✅ Item updated!', 'success');
    cancelEdit();
    updateStats();
    renderItems();
    updateCategorySelects();
}

// Delete item
function deleteItem(id) {
    if (!confirm('Delete this item permanently?')) return;
    
    for (var cat in menuData) {
        var index = menuData[cat].findIndex(i => i.id === id);
        if (index !== -1) {
            menuData[cat].splice(index, 1);
            if (menuData[cat].length === 0) {
                delete menuData[cat];
            }
            break;
        }
    }
    
    saveLocal();
    saveToAPI();
    showMsg('msg', '✅ Item deleted', 'success');
    updateStats();
    renderItems();
    updateCategorySelects();
}

// Render items
function renderItems() {
    var search = (document.getElementById('sp')?.value || '').toLowerCase();
    var container = document.getElementById('pList');
    var html = '';
    
    var cats = getCategories();
    
    if (cats.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;padding:30px">No items yet. Add your first item above!</p>';
        return;
    }
    
    cats.forEach(function(cat) {
        var items = menuData[cat];
        if (search) {
            items = items.filter(item => 
                item.name.toLowerCase().includes(search) || 
                cat.toLowerCase().includes(search)
            );
        }
        if (items.length === 0) return;
        
        html += '<h3 style="color:#C9A96E;margin:15px 0 10px;font-size:0.9rem">' + cat + ' (' + items.length + ')</h3>';
        
        items.forEach(function(item) {
            html += '<div class="item-row">' +
                (item.image ? 
                    '<img src="' + item.image + '" onerror="this.style.display=\'none\'">' : 
                    '<div style="width:50px;height:50px;background:#0A0A0A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🍽️</div>'
                ) +
                '<div class="info"><h3>' + item.name + '</h3><p>' + item.price + ' ETB | ID: ' + item.id + '</p></div>' +
                '<button class="btn-blue" onclick="editItem(\'' + item.id + '\')">✏️ Edit</button>' +
                '<button class="btn-red" onclick="deleteItem(\'' + item.id + '\')">🗑️</button>' +
                '</div>';
        });
    });
    
    if (!html) {
        html = '<p style="text-align:center;color:#888;padding:30px">No items match your search</p>';
    }
    
    container.innerHTML = html;
}

// Export/Import
function exportData() {
    var dataStr = JSON.stringify(menuData, null, 2);
    var blob = new Blob([dataStr], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'lantica_menu_backup_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showMsg('msg', '✅ Menu exported!', 'success');
}

function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    
    if (!confirm('This will replace your current menu. Continue?')) return;
    
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            if (typeof data === 'object' && Object.keys(data).length > 0) {
                menuData = data;
                saveLocal();
                saveToAPI();
                updateStats();
                renderItems();
                updateCategorySelects();
                showMsg('msg', '✅ Menu imported successfully!', 'success');
            } else {
                showMsg('msg', '❌ Invalid menu format', 'error');
            }
        } catch (err) {
            showMsg('msg', '❌ Invalid JSON file', 'error');
        }
    };
    reader.readAsText(file);
}

// Utility
function showMsg(id, text, type) {
    var m = document.getElementById(id);
    m.textContent = text;
    m.className = 'msg ' + type;
    setTimeout(function() {
        m.className = 'msg';
    }, 3000);
}

// Initialize
loadMenu();
</script>
