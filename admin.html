<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .login-box{background:#111;padding:40px;border-radius:15px;max-width:400px;margin:100px auto;text-align:center;border:1px solid #C9A96E}
        .login-box h2{color:#C9A96E;margin-bottom:20px;font-family:'Playfair Display',serif}
        .login-box input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .login-box .btn-gold{width:100%;padding:14px;font-size:1rem}
        .hidden{display:none!important}
        h1{color:#C9A96E;margin-bottom:15px;font-size:1.5rem;text-align:center}
        .card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:12px;font-size:1.1rem}
        .row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:8px;font-family:inherit}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#C9A96E}
        button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.3s}
        .btn-gold{background:#C9A96E;color:#000}.btn-gold:hover{background:#b8933f}
        .btn-red{background:#c0392b;color:#fff}.btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}.btn-orange{background:#e67e22;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:20px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:10px;transition:0.3s}
        .upload-box:hover{background:#1a1a1a;border-color:#fff}
        .preview-row{display:flex;gap:15px;margin-bottom:10px;align-items:center}
        .preview-row img{width:120px;height:120px;object-fit:cover;border-radius:8px;display:none;border:2px solid #333}
        .preview-row img.show{border-color:#C9A96E}
        .msg{padding:10px;margin:8px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:15px;padding:12px;background:#1a1a1a;border-radius:8px;margin-bottom:8px;border:1px solid #333;flex-wrap:wrap}
        .item-row:hover{background:#222}
        .item-row img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #333;cursor:pointer}
        .item-row img:hover{border-color:#C9A96E}
        .item-row .info{flex:1;min-width:150px}.item-row .info h3{color:#C9A96E;font-size:0.9rem}.item-row .info p{color:#888;font-size:0.75rem}
        .search-box{width:100%;padding:10px;background:#1a1a1a;border:2px solid #C9A96E;border-radius:20px;color:#fff;margin-bottom:15px}
        .edit-form{display:none;background:#1a1a1a;padding:20px;border-radius:8px;margin:10px 0;border:2px solid #C9A96E}.edit-form.show{display:block}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
        .btn-sm{padding:6px 14px;font-size:0.8rem}
        .cat-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:15px}
        .cat-tab{padding:6px 14px;border:1px solid #C9A96E;background:transparent;color:#C9A96E;border-radius:20px;cursor:pointer;font-size:0.8rem}
        .cat-tab.active,.cat-tab:hover{background:#C9A96E;color:#000}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
        .stat{background:#111;padding:12px;border-radius:8px;text-align:center;border:1px solid #333}
        .stat .num{font-size:1.3rem;font-weight:700;color:#C9A96E}.stat .lbl{font-size:0.65rem;color:#888}
        .login-error{color:#e74c3c;margin-top:10px;display:none}
        @media(max-width:600px){.row{flex-direction:column}.preview-row{justify-content:center}}
    </style>
</head>
<body>
<div class="container">

<div id="loginScreen" class="login-box">
    <h2>🔐 Lantica Admin</h2>
    <input type="password" id="loginPassword" placeholder="Enter Admin Password" onkeypress="if(event.key==='Enter')login()">
    <button class="btn-gold" onclick="login()">Access Admin</button>
    <p class="login-error" id="loginError">❌ Wrong password! Try again.</p>
</div>

<div id="adminPanel" class="hidden">
<div class="top-bar">
    <h1 style="margin:0">🍽️ Lantica 1960 Admin</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-orange btn-sm" onclick="loadAllDefaults()">🔄 Load All Defaults</button>
        <button class="btn-green btn-sm" onclick="saveData()">💾 Save</button>
        <button class="btn-blue btn-sm" onclick="loadData()">🔄 Reload</button>
        <button class="btn-red btn-sm" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="stats">
    <div class="stat"><div class="num" id="statItems">0</div><div class="lbl">Total Items</div></div>
    <div class="stat"><div class="num" id="statCats">0</div><div class="lbl">Categories</div></div>
    <div class="stat"><div class="num" id="statImg">0</div><div class="lbl">With Images</div></div>
</div>

<div class="card"><h2>➕ Add New Item</h2>
<div class="upload-box" onclick="document.getElementById('addFile').click()"><div style="font-size:30px">📷</div><div style="font-size:0.8rem;color:#888">Click to Upload Image (or paste URL below)</div></div>
<input type="file" id="addFile" accept="image/*" style="display:none" onchange="handleAddImage()">
<div class="preview-row"><img id="addPreview"><span id="addStatus" style="font-size:0.8rem;color:#C9A96E"></span></div>
<input type="hidden" id="addImageUrl">
<div class="row"><input type="text" id="addName" placeholder="Item Name *"><input type="number" id="addPrice" placeholder="Price (ETB) *"></div>
<div class="row"><select id="addCategory"><option value="">Select Category</option></select><input type="text" id="addImageManual" placeholder="Or paste image URL here"></div>
<div class="row"><input type="text" id="addDescription" placeholder="Description / Ingredients (optional)"></div>
<div class="row"><input type="text" id="newCategory" placeholder="➕ New category name"><button class="btn-gold btn-sm" onclick="addNewCategory()">+ Add Category</button></div>
<button class="btn-gold" onclick="addItem()">✅ Add Item</button><div id="msg" class="msg"></div>
</div>

<div class="edit-form" id="editForm"><h2>✏️ Edit Item</h2>
<input type="hidden" id="editId"><input type="hidden" id="editOrigCat">
<div class="upload-box" onclick="document.getElementById('editFile').click()"><div style="font-size:30px">📷</div><div style="font-size:0.8rem;color:#888">Click to Change Image</div></div>
<input type="file" id="editFile" accept="image/*" style="display:none" onchange="handleEditImage()">
<div class="preview-row"><img id="editPreview"><span id="editStatus" style="font-size:0.8rem;color:#C9A96E"></span></div>
<input type="hidden" id="editImageUrl">
<div class="row"><input type="text" id="editName" placeholder="Name"><input type="number" id="editPrice" placeholder="Price"></div>
<div class="row"><select id="editCategory"><option value="">Category</option></select><input type="text" id="editImageManual" placeholder="Or paste image URL"></div>
<input type="text" id="editDescription" placeholder="Description / Ingredients">
<button class="btn-green" onclick="saveEdit()">💾 Save Changes</button>
<button class="btn-red" onclick="closeEdit()">Cancel</button>
<button class="btn-red" onclick="deleteEditItem()" style="margin-left:10px">🗑️ Delete</button></div>

<div class="card"><h2>📋 All Menu Items</h2>
<input type="text" class="search-box" placeholder="🔍 Search items..." id="searchBox" oninput="renderItems()">
<div class="cat-tabs" id="catTabs"></div>
<div id="itemList">Loading...</div></div>
</div>
</div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',API='https://lantica-menu.developeraddis.workers.dev/api/menu';
var ADMIN_PASSWORD='Lantica1960@';
var menuData={},currentCat='all';

function login(){
    var pw=document.getElementById('loginPassword').value;
    if(pw===ADMIN_PASSWORD){
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadData();
        document.getElementById('loginPassword').value='';
        document.getElementById('loginError').style.display='none';
    }else{
        document.getElementById('loginError').style.display='block';
        document.getElementById('loginPassword').value='';
    }
}
function logout(){
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    menuData={};
    document.getElementById('itemList').innerHTML='Loading...';
}

async function loadData(){
    try{var r=await fetch(API);var d=await r.json();if(Object.keys(d).length>0)menuData=d;else menuData={}}catch(e){menuData={}}
    renderAll();updateStats();
}
async function saveData(){
    try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(menuData)});var d=await r.json();if(d.success)showMsg('msg','✅ Saved!','success')}catch(e){showMsg('msg','❌ '+e.message,'error')}
}
async function uploadToCloudinary(file,previewId,statusId,hiddenId){
    var s=document.getElementById(statusId);s.textContent='Uploading...';s.style.color='#C9A96E';
    var fd=new FormData();fd.append('file',file);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});var d=await r.json();
    if(d.secure_url){document.getElementById(hiddenId).value=d.secure_url;document.getElementById(previewId).src=d.secure_url;document.getElementById(previewId).style.display='block';s.textContent='✅';s.style.color='#27ae60'}}catch(e){s.textContent='❌';s.style.color='#e74c3c'}
}
function handleAddImage(){var f=document.getElementById('addFile').files[0];if(f)uploadToCloudinary(f,'addPreview','addStatus','addImageUrl')}
function handleEditImage(){var f=document.getElementById('editFile').files[0];if(f)uploadToCloudinary(f,'editPreview','editStatus','editImageUrl')}

function getCats(){return Object.keys(menuData)}
function getAllItems(){var items=[];for(var k in menuData)menuData[k].forEach(function(i){items.push({...i,category:k})});return items}
function updateStats(){
    var items=getAllItems();
    document.getElementById('statItems').textContent=items.length;
    document.getElementById('statCats').textContent=getCats().length;
    document.getElementById('statImg').textContent=items.filter(i=>i.image&&i.image.trim()).length;
}
function renderAll(){
    renderItems();
    var cats=getCats();
    var opts='<option value="">Select Category</option>';
    cats.forEach(function(c){opts+='<option value="'+esc(c)+'">'+c+'</option>'});
    document.getElementById('addCategory').innerHTML=opts;
    document.getElementById('editCategory').innerHTML=opts;
    var tabs='<span class="cat-tab '+(currentCat=='all'?'active':'')+'" onclick="setCat(\'all\')">All</span>';
    cats.forEach(function(c){tabs+='<span class="cat-tab '+(currentCat==c?'active':'')+'" onclick="setCat(\''+esc(c)+'\')">'+c+'</span>'});
    document.getElementById('catTabs').innerHTML=tabs;
}
function setCat(c){currentCat=c;renderAll()}
function getImageUrl(img){
    if(!img||img==='')return'https://placehold.co/60/1A1A1A/C9A96E?text=No+Image';
    if(img.startsWith('http'))return img;
    return'https://raw.githubusercontent.com/developereth/Lantica/main/'+img;
}
function renderItems(){
    var search=(document.getElementById('searchBox')?.value||'').toLowerCase();
    var items=getAllItems();
    if(currentCat!='all')items=items.filter(function(i){return i.category==currentCat});
    if(search)items=items.filter(function(i){return i.name.toLowerCase().indexOf(search)!==-1});
    var c=document.getElementById('itemList');
    if(!items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No items. Click "Load All Defaults" or add items above.</p>';return}
    c.innerHTML=items.map(function(p){
        var img=getImageUrl(p.image);
        return'<div class="item-row"><img src="'+img+'" onerror="this.src=\'https://placehold.co/60/1A1A1A/C9A96E\'" onclick="window.open(\''+img+'\',\'_blank\')"><div class="info"><h3>'+esc(p.name)+'</h3><p>📂 '+esc(p.category)+' | 💰 '+p.price+' ETB | 🖼️ '+(p.image?'Yes':'No')+(p.description?' | 📝 '+esc(p.description.substring(0,30)):'')+'</p></div><button class="btn-blue btn-sm" onclick="openEdit(\''+esc(p.category)+'\',\''+p.id+'\')">✏️ Edit</button><button class="btn-red btn-sm" onclick="deleteItem(\''+esc(p.category)+'\',\''+p.id+'\')">🗑️</button></div>';
    }).join('');
}

function addItem(){
    var n=document.getElementById('addName').value.trim();
    var pr=parseInt(document.getElementById('addPrice').value)||0;
    var cat=document.getElementById('addCategory').value;
    var img=document.getElementById('addImageUrl').value||document.getElementById('addImageManual').value.trim();
    var desc=document.getElementById('addDescription').value.trim();
    if(!n||!pr||!cat){showMsg('msg','❌ Fill name, price, and category','error');return}
    if(!menuData[cat])menuData[cat]=[];
    var maxId=0;for(var k in menuData)menuData[k].forEach(function(i){if(parseInt(i.id)>maxId)maxId=parseInt(i.id)});
    menuData[cat].push({id:String(maxId+1),name:n,price:pr,image:img,description:desc});
    document.getElementById('addName').value='';document.getElementById('addPrice').value='';document.getElementById('addImageManual').value='';document.getElementById('addDescription').value='';
    document.getElementById('addImageUrl').value='';document.getElementById('addPreview').style.display='none';document.getElementById('addStatus').textContent='';document.getElementById('addFile').value='';
    saveData();renderAll();updateStats();showMsg('msg','✅ Item added!','success');
}

function openEdit(cat,id){
    var p=menuData[cat].find(function(x){return x.id==id});if(!p)return;
    document.getElementById('editId').value=id;document.getElementById('editOrigCat').value=cat;
    document.getElementById('editName').value=p.name;document.getElementById('editPrice').value=p.price;
    document.getElementById('editCategory').value=cat;document.getElementById('editImageManual').value=p.image||'';
    document.getElementById('editDescription').value=p.description||'';
    document.getElementById('editImageUrl').value=p.image||'';
    if(p.image){var img=p.image.startsWith('http')?p.image:'https://raw.githubusercontent.com/developereth/Lantica/main/'+p.image;document.getElementById('editPreview').src=img;document.getElementById('editPreview').style.display='block'}else{document.getElementById('editPreview').style.display='none'}
    document.getElementById('editStatus').textContent='';document.getElementById('editFile').value='';
    document.getElementById('editForm').classList.add('show');document.getElementById('editForm').scrollIntoView({behavior:'smooth'});
}
function closeEdit(){document.getElementById('editForm').classList.remove('show')}
function saveEdit(){
    var id=document.getElementById('editId').value,ocat=document.getElementById('editOrigCat').value;
    var n=document.getElementById('editName').value.trim(),pr=parseInt(document.getElementById('editPrice').value)||0;
    var cat=document.getElementById('editCategory').value;
    var img=document.getElementById('editImageUrl').value||document.getElementById('editImageManual').value.trim();
    var desc=document.getElementById('editDescription').value.trim();
    var p=menuData[ocat].find(function(x){return x.id==id});if(!p)return;
    if(ocat===cat){p.name=n;p.price=pr;p.image=img;p.description=desc}else{
        menuData[ocat]=menuData[ocat].filter(function(x){return x.id!=id});
        if(!menuData[cat])menuData[cat]=[];
        menuData[cat].push({id:id,name:n,price:pr,image:img,description:desc});
        if(!menuData[ocat].length)delete menuData[ocat];
    }
    closeEdit();saveData();renderAll();updateStats();showMsg('msg','✅ Updated!','success');
}
function deleteEditItem(){var id=document.getElementById('editId').value,cat=document.getElementById('editOrigCat').value;if(!confirm('Delete?'))return;menuData[cat]=menuData[cat].filter(function(x){return x.id!=id});if(!menuData[cat].length)delete menuData[cat];closeEdit();saveData();renderAll();updateStats();showMsg('msg','🗑️ Deleted','success')}
function deleteItem(cat,id){if(!confirm('Delete?'))return;menuData[cat]=menuData[cat].filter(function(x){return x.id!=id});if(!menuData[cat].length)delete menuData[cat];saveData();renderAll();updateStats();showMsg('msg','🗑️ Deleted','success')}
function addNewCategory(){var n=document.getElementById('newCategory').value.trim();if(!n)return;if(!menuData[n])menuData[n]=[];document.getElementById('newCategory').value='';saveData();renderAll();showMsg('msg','✅ Category added!','success')}
