<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Lantica 1960</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E8E0D5;padding:20px}
        :root{--gold:#C9A96E;--dark-card:#1A1A1A;--border:#2C2823}
        .container{max-width:1200px;margin:0 auto}
        .login-box{background:var(--dark-card);padding:40px;border-radius:18px;max-width:400px;margin:100px auto;text-align:center;border:1px solid var(--border)}
        .login-box h2{color:var(--gold);margin-bottom:20px;font-family:'Playfair Display',serif}
        .login-box input{width:100%;padding:14px;background:#0A0A0A;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:1rem;text-align:center;margin-bottom:15px}
        .login-box input:focus{outline:none;border-color:var(--gold)}
        .hidden{display:none!important}
        h1{color:var(--gold);margin-bottom:20px;text-align:center;font-family:'Playfair Display',serif;font-size:2rem}
        .card{background:var(--dark-card);padding:25px;border-radius:12px;margin-bottom:25px;border:1px solid var(--border)}
        h2{color:var(--gold);margin-bottom:15px;font-size:1.2rem}
        .row{display:flex;gap:12px;margin-bottom:12px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:12px;background:#0A0A0A;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:12px;font-family:inherit}
        input:focus,select:focus{outline:none;border-color:var(--gold)}
        button{padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.9rem;transition:0.3s}
        .btn-gold{background:var(--gold);color:#0A0A0A}.btn-gold:hover{background:#B8933F}
        .btn-red{background:#c0392b;color:#fff}.btn-red:hover{background:#e74c3c}
        .btn-blue{background:#3498db;color:#fff;padding:8px 16px;font-size:0.8rem}
        .btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed var(--gold);padding:20px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:12px;transition:0.3s;background:#0A0A0A}
        .upload-box:hover{background:#111;border-color:#fff}
        .upload-box i{font-size:2rem;color:var(--gold);margin-bottom:5px}
        .preview-row{margin-bottom:12px;text-align:center}
        .preview-row img{max-width:200px;max-height:150px;object-fit:cover;border-radius:8px;display:none;margin:0 auto}
        .status-row{margin-bottom:12px;font-size:0.75rem;text-align:center}
        .msg{padding:12px;margin:10px 0;border-radius:8px;display:none;text-align:center;font-weight:600;animation:fadeIn 0.3s}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .item-row{display:flex;align-items:center;gap:12px;padding:12px;background:#0A0A0A;border-radius:8px;margin-bottom:8px;border:1px solid var(--border)}
        .item-row:hover{background:#111}
        .item-row img{width:50px;height:50px;object-fit:cover;border-radius:6px}
        .item-row .info{flex:1}.item-row .info h3{color:var(--gold);font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .search-box{width:100%;padding:12px;background:#0A0A0A;border:2px solid var(--gold);border-radius:25px;color:#fff;margin-bottom:15px}
        .edit-form{display:none;background:#0A0A0A;padding:20px;border-radius:8px;margin:10px 0;border:1px solid var(--gold)}
        .edit-form.show{display:block}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
        .stat{background:var(--dark-card);padding:15px;border-radius:8px;text-align:center;border:1px solid var(--border)}
        .stat .num{font-size:1.5rem;font-weight:700;color:var(--gold)}.stat .lbl{font-size:0.7rem;color:#888;margin-top:3px}
        @media(max-width:768px){.row{flex-direction:column}.stats{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">

<!-- LOGIN -->
<div id="loginScreen" class="login-box">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="pw" placeholder="Enter Password" onkeypress="if(event.key==='Enter')login()">
    <button class="btn-gold" onclick="login()">Access Admin</button>
    <p id="loginErr" style="color:#e74c3c;margin-top:10px;display:none">❌ Wrong password</p>
</div>

<!-- ADMIN PANEL -->
<div id="panel" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <h1 style="margin:0">🍽️ Menu Admin</h1>
    <button class="btn-red" onclick="logout()" style="padding:8px 16px">🚪 Logout</button>
</div>

<div class="stats">
    <div class="stat"><div class="num" id="statCats">0</div><div class="lbl">Categories</div></div>
    <div class="stat"><div class="num" id="statItems">0</div><div class="lbl">Total Items</div></div>
    <div class="stat"><div class="num" id="statImg">0</div><div class="lbl">With Images</div></div>
</div>

<!-- ADD ITEM -->
<div class="card">
    <h2>➕ Add New Item</h2>
    
    <div class="upload-box" onclick="document.getElementById('f1').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <div style="font-size:0.8rem;color:#888">Click to upload image (or paste URL below)</div>
    </div>
    <input type="file" id="f1" accept="image/*" style="display:none" onchange="uploadAddImage()">
    <div class="preview-row"><img id="pv1" alt="Preview"></div>
    <div class="status-row" id="st1"></div>
    <input type="hidden" id="u1">
    <input type="text" id="imageUrl" placeholder="Or paste image URL directly" onchange="setAddImageUrl()" style="margin-bottom:12px">
    
    <div class="row">
        <input type="text" id="iname" placeholder="Item Name *">
        <input type="number" id="iprice" placeholder="Price (ETB) *">
    </div>
    <div class="row">
        <select id="icategory">
            <option value="">Select Category</option>
        </select>
        <input type="text" id="inewcat" placeholder="Or type new category name">
    </div>
    <button class="btn-gold" onclick="addItem()">✅ Add Item</button>
    <div id="msg" class="msg"></div>
</div>

<!-- EDIT FORM -->
<div class="edit-form" id="editForm">
    <h2>✏️ Edit Item</h2>
    <input type="hidden" id="editId">
    <input type="hidden" id="editOldCat">
    
    <div class="upload-box" onclick="document.getElementById('ef1').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <div style="font-size:0.8rem;color:#888">Click to change image (or paste URL below)</div>
    </div>
    <input type="file" id="ef1" accept="image/*" style="display:none" onchange="uploadEditImage()">
    <div class="preview-row"><img id="ep1" alt="Preview"></div>
    <div class="status-row" id="es1"></div>
    <input type="hidden" id="eu1">
    <input type="text" id="eimageUrl" placeholder="Or paste image URL directly" onchange="setEditImageUrl()" style="margin-bottom:12px">
    
    <div class="row">
        <input type="text" id="ename" placeholder="Name *">
        <input type="number" id="eprice" placeholder="Price *">
    </div>
    <div class="row">
        <select id="ecategory"></select>
        <input type="text" id="enewcat" placeholder="Or new category">
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn-green" id="saveEditBtn" onclick="saveEdit()">💾 Save Changes</button>
        <button class="btn-red" onclick="cancelEdit()">Cancel</button>
    </div>
</div>

<!-- ITEMS LIST -->
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">📋 Menu Items</h2>
        <button class="btn-blue" onclick="exportData()">📥 Export JSON</button>
    </div>
    <input type="text" class="search-box" placeholder="🔍 Search items..." id="sp" oninput="renderItems()">
    <div id="pList">Loading...</div>
</div>
</div>
</div>

<script>
// ===== YOUR CONFIGURATION =====
var API_URL = 'https://lantica-menu.developeraddis.workers.dev/api/menu';
var CLOUD_NAME = 'dnxxxpbm9';
var UPLOAD_PRESET = 'lantica_upload';
var ADMIN_PASSWORD = 'Lantica1960';

var menuData = {};

// ===== AUTH =====
function login() {
    if (document.getElementById('pw').value === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        loadMenu();
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

function logout() {
    document.getElementById('panel').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('pw').value = '';
    document.getElementById('loginErr').style.display = 'none';
}

// ===== CLOUDINARY UPLOAD =====
async function uploadToCloudinary(file, previewId, statusId, hiddenId) {
    var statusEl = document.getElementById(statusId);
    statusEl.textContent = '⏳ Uploading...';
    statusEl.style.color = '#C9A96E';
    
    var formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', 'lantica-menu');
    
    try {
        var response = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
            method: 'POST',
            body: formData
        });
        
        var data = await response.json();
        
        if (data.secure_url) {
            document.getElementById(hiddenId).value = data.secure_url;
            document.getElementById(previewId).src = data.secure_url;
            document.getElementById(previewId).style.display = 'block';
            statusEl.textContent = '✅ Uploaded!';
            statusEl.style.color = '#27ae60';
            console.log('✅ Image:', data.secure_url);
        } else {
            statusEl.textContent = '❌ Failed: ' + (data.error?.message || 'Unknown');
            statusEl.style.color = '#e74c3c';
        }
    } catch(e) {
        statusEl.textContent = '❌ Network error';
        statusEl.style.color = '#e74c3c';
    }
}

function uploadAddImage() {
    var file = document.getElementById('f1').files[0];
    if (file) uploadToCloudinary(file, 'pv1', 'st1', 'u1');
}

function uploadEditImage() {
    var file = document.getElementById('ef1').files[0];
    if (file) uploadToCloudinary(file, 'ep1', 'es1', 'eu1');
}

function setAddImageUrl() {
    var url = document.getElementById('imageUrl').value.trim();
    if (url) {
        document.getElementById('u1').value = url;
        document.getElementById('pv1').src = url;
        document.getElementById('pv1').style.display = 'block';
    }
}

function setEditImageUrl() {
    var url = document.getElementById('eimageUrl').value.trim();
    if (url) {
        document.getElementById('eu1').value = url;
        document.getElementById('ep1').src = url;
        document.getElementById('ep1').style.display = 'block';
    }
}

// ===== API CALLS =====
async function loadMenu() {
    try {
        var r = await fetch(API_URL);
        var d = await r.json();
        if (d.success && d.menu) {
            menuData = d.menu;
            console.log('✅ Loaded:', Object.keys(menuData).length, 'categories');
        } else {
            showMsg('msg', '⚠️ API returned empty menu', 'error');
            menuData = {};
        }
    } catch(e) {
        showMsg('msg', '❌ Cannot connect to API', 'error');
        menuData = {};
    }
    afterLoad();
}

function afterLoad() {
    updateStats();
    renderItems();
    updateCategorySelects();
}

function getCategories() {
    return Object.keys(menuData).sort();
}

function updateCategorySelects() {
    var cats = getCategories();
    var options = cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '">' + c + '</option>').join('');
    document.getElementById('icategory').innerHTML = '<option value="">Select Category</option>' + options;
    document.getElementById('ecategory').innerHTML = options;
}

function updateStats() {
    var cats = getCategories();
    var total = 0, withImg = 0;
    cats.forEach(cat => {
        total += menuData[cat].length;
        menuData[cat].forEach(item => {
            if (item.image && item.image !== '') withImg++;
        });
    });
    document.getElementById('statCats').textContent = cats.length;
    document.getElementById('statItems').textContent = total;
    document.getElementById('statImg').textContent = withImg;
}

// ===== ADD ITEM =====
async function addItem() {
    var name = document.getElementById('iname').value.trim();
    var price = document.getElementById('iprice').value.trim();
    var category = document.getElementById('icategory').value;
    var newCat = document.getElementById('inewcat').value.trim();
    var image = document.getElementById('u1').value || document.getElementById('imageUrl').value.trim();
    
    if (!name || !price) { showMsg('msg', '❌ Fill name and price', 'error'); return; }
    if (!category && !newCat) { showMsg('msg', '❌ Select or enter category', 'error'); return; }
    
    var finalCat = newCat || category;
    
    try {
        var r = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: finalCat,
                name: name,
                price: parseInt(price),
                image: image
            })
        });
        var d = await r.json();
        if (d.success) {
            menuData = d.menu;
            showMsg('msg', '✅ Item added!', 'success');
            clearAddForm();
            afterLoad();
        } else {
            showMsg('msg', '❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch(e) {
        showMsg('msg', '❌ Cannot connect to API', 'error');
    }
}

function clearAddForm() {
    document.getElementById('iname').value = '';
    document.getElementById('iprice').value = '';
    document.getElementById('icategory').value = '';
    document.getElementById('inewcat').value = '';
    document.getElementById('u1').value = '';
    document.getElementById('imageUrl').value = '';
    document.getElementById('pv1').style.display = 'none';
    document.getElementById('st1').textContent = '';
    document.getElementById('f1').value = '';
}

// ===== EDIT ITEM =====
function editItem(id) {
    var item = null, catName = '';
    for (var cat in menuData) {
        var found = menuData[cat].find(i => i.id === id);
        if (found) { item = found; catName = cat; break; }
    }
    if (!item) return;
    
    document.getElementById('editId').value = item.id;
    document.getElementById('editOldCat').value = catName;
    document.getElementById('ename').value = item.name;
    document.getElementById('eprice').value = item.price;
    document.getElementById('ecategory').value = catName;
    document.getElementById('enewcat').value = '';
    document.getElementById('eu1').value = item.image || '';
    document.getElementById('eimageUrl').value = item.image || '';
    
    if (item.image) {
        document.getElementById('ep1').src = item.image;
        document.getElementById('ep1').style.display = 'block';
    } else {
        document.getElementById('ep1').style.display = 'none';
    }
    
    document.getElementById('es1').textContent = '';
    document.getElementById('ef1').value = '';
    document.getElementById('editForm').classList.add('show');
    document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
}

function cancelEdit() {
    document.getElementById('editForm').classList.remove('show');
}

async function saveEdit() {
    var id = document.getElementById('editId').value;
    var oldCat = document.getElementById('editOldCat').value;
    var name = document.getElementById('ename').value.trim();
    var price = document.getElementById('eprice').value.trim();
    var category = document.getElementById('ecategory').value;
    var newCat = document.getElementById('enewcat').value.trim();
    var image = document.getElementById('eu1').value || document.getElementById('eimageUrl').value.trim();
    
    if (!name || !price) { alert('Fill name and price'); return; }
    
    var finalCat = newCat || category;
    var btn = document.getElementById('saveEditBtn');
    btn.textContent = 'Saving...';
    btn.disabled = true;
    
    try {
        var r = await fetch(API_URL + '/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                price: parseInt(price),
                category: finalCat,
                oldCategory: oldCat,
                image: image
            })
        });
        var d = await r.json();
        if (d.success) {
            menuData = d.menu;
            showMsg('msg', '✅ Updated!', 'success');
            cancelEdit();
            afterLoad();
        } else {
            showMsg('msg', '❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch(e) {
        showMsg('msg', '❌ Cannot connect to API', 'error');
    }
    
    btn.textContent = '💾 Save Changes';
    btn.disabled = false;
}

// ===== DELETE ITEM =====
async function deleteItem(id) {
    if (!confirm('Delete this item permanently?')) return;
    
    try {
        var r = await fetch(API_URL + '/' + id, { method: 'DELETE' });
        var d = await r.json();
        if (d.success) {
            menuData = d.menu;
            showMsg('msg', '✅ Deleted!', 'success');
            afterLoad();
        } else {
            showMsg('msg', '❌ ' + (d.error || 'Failed'), 'error');
        }
    } catch(e) {
        showMsg('msg', '❌ Cannot connect to API', 'error');
    }
}

// ===== RENDER ITEMS =====
function renderItems() {
    var search = (document.getElementById('sp')?.value || '').toLowerCase();
    var container = document.getElementById('pList');
    var html = '';
    var cats = getCategories();
    
    if (cats.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;padding:30px">No items yet. Add your first item above!</p>';
        return;
    }
    
    cats.forEach(cat => {
        var items = menuData[cat];
        if (search) {
            items = items.filter(item => 
                item.name.toLowerCase().includes(search) || 
                cat.toLowerCase().includes(search)
            );
        }
        if (items.length === 0) return;
        
        html += '<h3 style="color:#C9A96E;margin:15px 0 10px;font-size:0.9rem">' + cat + ' (' + items.length + ')</h3>';
        
        items.forEach(item => {
            html += '<div class="item-row">' +
                (item.image ? 
                    '<img src="' + item.image + '" onerror="this.style.display=\'none\'">' : 
                    '<div style="width:50px;height:50px;background:#0A0A0A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🍽️</div>'
                ) +
                '<div class="info"><h3>' + item.name + '</h3><p>' + item.price + ' ETB</p></div>' +
                '<button class="btn-blue" onclick="editItem(\'' + item.id + '\')" style="margin-right:5px">✏️</button>' +
                '<button class="btn-red" onclick="deleteItem(\'' + item.id + '\')">🗑️</button>' +
                '</div>';
        });
    });
    
    if (!html) html = '<p style="text-align:center;color:#888;padding:30px">No items match your search</p>';
    container.innerHTML = html;
}

// ===== EXPORT =====
function exportData() {
    var data = JSON.stringify(menuData, null, 2);
    var blob = new Blob([data], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'lantica_menu_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showMsg('msg', '✅ Exported!', 'success');
}

function showMsg(id, text, type) {
    var m = document.getElementById(id);
    m.textContent = text;
    m.className = 'msg ' + type;
    setTimeout(function() { m.className = 'msg'; }, 3000);
}

// ===== INIT =====
console.log('🔧 Admin ready - API mode');
</script>
</body>
</html>
