<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Admin | Lantica 1960</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:900px;margin:0 auto}
        h1{color:#C9A96E;margin-bottom:15px;font-size:1.5rem;text-align:center}
        .card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
        h2{color:#C9A96E;margin-bottom:12px;font-size:1.1rem}
        .row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
        input,select,textarea{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.9rem;margin-bottom:8px;font-family:inherit}
        input:focus,select:focus,textarea:focus{outline:none;border-color:#C9A96E}
        button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        .btn-gold{background:#C9A96E;color:#000}.btn-red{background:#c0392b;color:#fff}.btn-blue{background:#3498db;color:#fff}.btn-green{background:#27ae60;color:#fff}
        .upload-box{border:2px dashed #C9A96E;padding:15px;text-align:center;border-radius:10px;cursor:pointer;margin-bottom:8px}
        .preview-row{margin-bottom:10px}.preview-row img{width:120px;height:120px;object-fit:cover;border-radius:8px;display:none}
        .msg{padding:10px;margin:8px 0;border-radius:8px;display:none;text-align:center;font-weight:600}
        .msg.success{background:#27ae60;display:block}.msg.error{background:#c0392b;display:block}
        .item-row{display:flex;align-items:center;gap:12px;padding:10px;background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:1px solid #333;flex-wrap:wrap}
        .item-row img{width:60px;height:60px;object-fit:cover;border-radius:8px}
        .item-row .info{flex:1}.item-row .info h3{color:#C9A96E;font-size:0.85rem}.item-row .info p{color:#888;font-size:0.7rem}
        .edit-form{display:none;background:#1a1a1a;padding:20px;border-radius:8px;margin:10px 0;border:2px solid #C9A96E}.edit-form.show{display:block}
        .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
        @media(max-width:600px){.row{flex-direction:column}}
    </style>
</head>
<body>
<div class="container">
<div class="top-bar"><h1 style="margin:0">🏛️ Heritage Admin</h1><div style="display:flex;gap:8px"><button class="btn-green" onclick="saveData()">💾 Save</button><button class="btn-blue" onclick="loadData()">🔄 Reload</button><button class="btn-gold" onclick="loadDefaults()">🔄 Load Defaults</button></div></div>

<!-- CONTENT -->
<div class="card"><h2>📝 Page Content</h2>
<input type="text" id="heroTitle" placeholder="Hero Title (HTML allowed)">
<textarea id="heroDesc" rows="2" placeholder="Hero Description"></textarea>
<input type="text" id="quote" placeholder="Quote">
<input type="text" id="storyTitle" placeholder="Story Title">
<textarea id="storyContent" rows="4" placeholder="Story Content (separate paragraphs with blank line)"></textarea>
<button class="btn-gold" onclick="saveContent()">💾 Save Content</button><div id="cmsg" class="msg"></div>
</div>

<!-- ADD ITEM -->
<div class="card"><h2>➕ Add Heritage Item</h2>
<div class="upload-box" onclick="document.getElementById('addFile').click()">📷 Upload Image to Cloudinary</div>
<input type="file" id="addFile" accept="image/*" style="display:none" onchange="uploadAddImage()">
<div class="preview-row"><img id="addPreview"><span id="addStatus" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="addImageUrl">
<input type="text" id="addTitle" placeholder="Title *"><input type="text" id="addBadge" placeholder="Badge (e.g. Historical, Rare)">
<input type="text" id="addImageManual" placeholder="Or paste image URL">
<textarea id="addStory" rows="3" placeholder="Story *"></textarea>
<textarea id="addMemory" rows="2" placeholder="Memory / Personal Note"></textarea>
<button class="btn-gold" onclick="addItem()">✅ Add Item</button><div id="msg" class="msg"></div>
</div>

<!-- EDIT FORM -->
<div class="edit-form" id="editForm"><h2>✏️ Edit Item</h2><input type="hidden" id="editId">
<div class="upload-box" onclick="document.getElementById('editFile').click()">📷 Change Image</div>
<input type="file" id="editFile" accept="image/*" style="display:none" onchange="uploadEditImage()">
<div class="preview-row"><img id="editPreview"><span id="editStatus" style="font-size:0.8rem;margin-left:10px;color:#C9A96E"></span></div>
<input type="hidden" id="editImageUrl">
<input type="text" id="editTitle" placeholder="Title"><input type="text" id="editBadge" placeholder="Badge">
<input type="text" id="editImageManual" placeholder="Or paste image URL">
<textarea id="editStory" rows="3" placeholder="Story"></textarea>
<textarea id="editMemory" rows="2" placeholder="Memory"></textarea>
<button class="btn-green" onclick="saveEdit()">💾 Save</button><button class="btn-red" onclick="closeEdit()">Cancel</button></div>

<!-- ITEMS LIST -->
<div class="card"><h2>📋 Heritage Items</h2><div id="itemList">Loading...</div></div>
</div>

<script>
var C='dnxxxpbm9',PR='lantica_upload',API='https://lantica-menu.developeraddis.workers.dev/api/heritage';
var data={items:[],content:{heroTitle:"🏛️ Heritage <span>Gallery</span>",heroDesc:"Step into the memory of Lantica 1960.",quote:"Every artifact tells a story.",storyTitle:"The Memory of Lantica 1960",storyContent:"These vintage treasures are more than objects.\n\nFrom the Emperor's era to modern Ethiopia.\n\nEvery item has a story."}};

loadData();

async function loadData(){
    try{var r=await fetch(API);var d=await r.json();if(d.items)data=d;loadContent();renderItems()}catch(e){loadContent();renderItems()}
}
async function saveData(){
    try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});var d=await r.json();if(d.success)showMsg('msg','✅ Saved!','success')}catch(e){showMsg('msg','❌ '+e.message,'error')}
}
async function uploadToCloudinary(file,previewId,statusId,hiddenId){
    var s=document.getElementById(statusId);s.textContent='Uploading...';s.style.color='#C9A96E';
    var fd=new FormData();fd.append('file',file);fd.append('upload_preset',PR);fd.append('folder','lantica-menu');
    try{var r=await fetch('https://api.cloudinary.com/v1_1/'+C+'/image/upload',{method:'POST',body:fd});var d=await r.json();
    if(d.secure_url){document.getElementById(hiddenId).value=d.secure_url;document.getElementById(previewId).src=d.secure_url;document.getElementById(previewId).style.display='block';s.textContent='✅';s.style.color='#27ae60'}}catch(e){s.textContent='❌'}
}
function uploadAddImage(){var f=document.getElementById('addFile').files[0];if(f)uploadToCloudinary(f,'addPreview','addStatus','addImageUrl')}
function uploadEditImage(){var f=document.getElementById('editFile').files[0];if(f)uploadToCloudinary(f,'editPreview','editStatus','editImageUrl')}

function loadContent(){
    document.getElementById('heroTitle').value=data.content.heroTitle||'';
    document.getElementById('heroDesc').value=data.content.heroDesc||'';
    document.getElementById('quote').value=data.content.quote||'';
    document.getElementById('storyTitle').value=data.content.storyTitle||'';
    document.getElementById('storyContent').value=data.content.storyContent||'';
}
function saveContent(){
    data.content.heroTitle=document.getElementById('heroTitle').value;
    data.content.heroDesc=document.getElementById('heroDesc').value;
    data.content.quote=document.getElementById('quote').value;
    data.content.storyTitle=document.getElementById('storyTitle').value;
    data.content.storyContent=document.getElementById('storyContent').value;
    saveData();showMsg('cmsg','✅ Content saved!','success');
}

function renderItems(){
    var c=document.getElementById('itemList');
    if(!data.items.length){c.innerHTML='<p style="text-align:center;color:#888;padding:30px">No items. Click "Load Defaults".</p>';return}
    c.innerHTML=data.items.map((p,i)=>'<div class="item-row"><img src="'+(p.image||'https://placehold.co/60/1A1A1A/C9A96E')+'" onerror="this.src=\'https://placehold.co/60/1A1A1A/C9A96E\'"><div class="info"><h3>'+esc(p.title)+'</h3><p>'+(p.badge||'')+' | '+esc((p.story||'').substring(0,50))+'...</p></div><button class="btn-blue" onclick="openEdit('+i+')">✏️</button><button class="btn-red" onclick="deleteItem('+i+')">🗑️</button></div>').join('')}
function addItem(){
    var t=document.getElementById('addTitle').value.trim(),s=document.getElementById('addStory').value.trim(),img=document.getElementById('addImageUrl').value||document.getElementById('addImageManual').value.trim();
    if(!t||!s||!img){showMsg('msg','❌ Fill title, story, image','error');return}
    data.items.push({title:t,image:img,story:s,memory:document.getElementById('addMemory').value.trim(),badge:document.getElementById('addBadge').value.trim()});
    ['addTitle','addBadge','addImageManual','addStory','addMemory'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('addImageUrl').value='';document.getElementById('addPreview').style.display='none';document.getElementById('addStatus').textContent='';document.getElementById('addFile').value='';
    saveData();renderItems();showMsg('msg','✅ Added!','success');
}
function openEdit(i){var p=data.items[i];document.getElementById('editId').value=i;document.getElementById('editTitle').value=p.title;document.getElementById('editBadge').value=p.badge||'';document.getElementById('editImageManual').value=p.image||'';document.getElementById('editStory').value=p.story||'';document.getElementById('editMemory').value=p.memory||'';document.getElementById('editImageUrl').value=p.image||'';if(p.image){document.getElementById('editPreview').src=p.image;document.getElementById('editPreview').style.display='block'}document.getElementById('editForm').classList.add('show');document.getElementById('editForm').scrollIntoView({behavior:'smooth'})}
function closeEdit(){document.getElementById('editForm').classList.remove('show')}
function saveEdit(){var i=parseInt(document.getElementById('editId').value);data.items[i].title=document.getElementById('editTitle').value;data.items[i].badge=document.getElementById('editBadge').value;data.items[i].image=document.getElementById('editImageUrl').value||document.getElementById('editImageManual').value;data.items[i].story=document.getElementById('editStory').value;data.items[i].memory=document.getElementById('editMemory').value;closeEdit();saveData();renderItems();showMsg('msg','✅ Updated!','success')}
function deleteItem(i){if(!confirm('Delete?'))return;data.items.splice(i,1);saveData();renderItems();showMsg('msg','🗑️ Deleted','success')}

function loadDefaults(){
    data={
        items:[
            {title:"Emperor Haile Selassie I Portrait",image:"https://raw.githubusercontent.com/developereth/Lantica/main/emperial1.jpg",story:"An original framed photograph of His Imperial Majesty Emperor Haile Selassie I.",memory:"Veteran customers remember the Emperor's visit.",badge:"Historical"},
            {title:"Vintage Camera Collection",image:"https://raw.githubusercontent.com/developereth/Lantica/main/old-camera1.jpg",story:"A collection of classic film cameras from the 1950s-1970s.",memory:"Three generations of loyal customers.",badge:"Collection"},
            {title:"Vintage DJ Mixer",image:"https://raw.githubusercontent.com/developereth/Lantica/main/old-dj-mixer.jpg",story:"A classic DJ mixer from the 1970s.",memory:"Unforgettable Friday night vibes.",badge:"Rare"},
            {title:"Old Record Player",image:"https://raw.githubusercontent.com/developereth/Lantica/main/old-player.jpg",story:"Gramophone player from the 1960s.",memory:"Vinyl crackling alongside coffee.",badge:"Vintage"},
            {title:"Antique Telescope",image:"https://raw.githubusercontent.com/developereth/Lantica/main/old-telescop.jpg",story:"Antique brass telescope from the early 1900s.",memory:"Gazing at Arat Kilo skyline.",badge:"Rare"},
            {title:"Vintage Pocket Watch",image:"https://raw.githubusercontent.com/developereth/Lantica/main/old-watch1.jpg",story:"Mechanical pocket watch from the 1940s.",memory:"Original owner for 30+ years.",badge:"Memory"}
        ],
        content:{heroTitle:"🏛️ Heritage <span>Gallery</span>",heroDesc:"Step into the memory of Lantica 1960.",quote:"Every artifact tells a story.",storyTitle:"The Memory of Lantica 1960",storyContent:"These vintage treasures are more than objects.\n\nFrom the Emperor's era to modern Ethiopia.\n\nEvery item has a story."}
    };
    saveData();loadContent();renderItems();showMsg('msg','✅ Defaults loaded!','success');
}
function showMsg(id,t,type){var m=document.getElementById(id);m.textContent=t;m.className='msg '+type;setTimeout(()=>m.className='msg',3000)}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
